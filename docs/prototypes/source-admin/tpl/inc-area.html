<div class="plot" key="{{@P@Key}}" onMouseLeave="{{@P@Leave}}" role="group" aria-label="Chart. Use Tab to move between points.">
  <sc-for list="{{@P@Grid}}" as="g" hint-placeholder-count="5"><div class="gridline" style="{{g.style}}"></div><span class="gridlbl" style="{{g.style}}">{{g.label}}</span></sc-for>
  <svg viewBox="0 0 600 200" preserveAspectRatio="none" style="position:absolute;inset:0;width:100%;height:100%;overflow:visible" aria-hidden="true">
    <defs><linearGradient id="@P@Grad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:{{@P@Color}};stop-opacity:.3"></stop><stop offset="1" style="stop-color:{{@P@Color}};stop-opacity:0"></stop></linearGradient></defs>
    <path class="area" d="{{@P@AreaD}}" fill="url(#@P@Grad)"></path>
    <path class="line" pathLength="1" d="{{@P@LineD}}" fill="none" stroke="{{@P@Color}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  <sc-for list="{{@P@Hits}}" as="h" key="{{h.key}}" hint-placeholder-count="12"><button class="hit" style="{{h.style}}" onMouseEnter="{{h.enter}}" onFocus="{{h.enter}}" aria-label="{{h.label}}"></button></sc-for>
  <sc-if value="{{@P@HasHover}}" hint-placeholder-val="{{ false }}"><div class="cross" style="{{@P@Cross}}"></div><div class="pt" style="{{@P@Pt}}"></div><div class="tip" style="{{@P@TipPos}}" aria-hidden="true">{{@P@TipLabel}}</div></sc-if>
</div>
<div class="xlabels" aria-hidden="true"><sc-for list="{{@P@XL}}" as="x" hint-placeholder-count="12"><span>{{x.l}}</span></sc-for></div>
