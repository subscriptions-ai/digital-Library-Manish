3 class=\"h2\">Choose your departments<\/h3><span class=\"sub\">Groups only help you find a subject. The price is per department.<\/span><\/div><span class=\"pill teal\">{{selCount}} selected<\/span><\/div>\n          <label class=\"search\" style=\"max-width:none;flex:none;cursor:text\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-3.5-3.5\"><\/path><\/svg><input type=\"search\" style=\"flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none\" value=\"{{sq}}\" onInput=\"{{setSq}}\" placeholder=\"Search departments…\" aria-label=\"Search departments\"><\/label>\n          <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{gtabs}}\" as=\"g\" hint-placeholder-count=\"7\"><button class=\"{{g.cls}}\" style=\"min-height:30px;font-size:12px\" aria-pressed=\"{{g.pressed}}\" onClick=\"{{g.pick}}\">{{g.l}}<\/button><\/sc-for><\/div>\n          <sc-for list=\"{{groups}}\" as=\"g\" key=\"{{g.key}}\" hint-placeholder-count=\"3\">\n            <div class=\"swap\">\n              <div style=\"display:flex;justify-content:space-between;align-items:center;margin-bottom:8px\"><span class=\"eyebrow\">{{g.g}} · {{g.count}}<\/span><button class=\"link\" style=\"font-size:12px\" onClick=\"{{g.toggle}}\">{{g.allLabel}}<\/button><\/div>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{g.chips}}\" as=\"c\" key=\"{{c.key}}\" hint-placeholder-count=\"5\"><button class=\"{{c.cls}}\" aria-pressed=\"{{c.pressed}}\" onClick=\"{{c.toggle}}\"><svg class=\"tick\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg>{{c.name}}<\/button><\/sc-for><\/div>\n            <\/div>\n          <\/sc-for>\n          <sc-if value=\"{{noMatch}}\" hint-placeholder-val=\"{{ false }}\"><p class=\"sub\">No department matches your search.<\/p><\/sc-if>\n        <\/article>\n\n        <article class=\"card rise\" style=\"animation-delay:160ms;flex:1 1 330px;min-width:0;padding:22px;display:flex;flex-direction:column;gap:16px\">\n          <h3 class=\"h2\">Your price<\/h3>\n          <div style=\"display:flex;gap:8px;flex-wrap:wrap\"><sc-for list=\"{{tiers}}\" as=\"t\" hint-placeholder-count=\"5\"><div class=\"{{t.cls}}\"><div style=\"font-size:11px;color:var(--muted);font-weight:600\">{{t.l}}<\/div><div style=\"font-weight:700;font-variant-numeric:tabular-nums\">{{t.price}}<\/div><\/div><\/sc-for><\/div>\n          <div><div class=\"meter\" role=\"img\" aria-label=\"Progress to the 5 department rate\"><i style=\"{{meterStyle}}\"><\/i><\/div><div class=\"sub\" style=\"margin-top:8px;font-size:12.5px\" aria-live=\"polite\">{{nudge}}<\/div><\/div>\n          <dl style=\"margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:14px\">\n            <dt style=\"color:var(--muted)\">Departments<\/dt><dd style=\"margin:0;text-align:right;font-weight:600\">{{selCount}} × {{unitPrice}}<\/dd>\n            <dt style=\"color:var(--muted)\">Subtotal<\/dt><dd style=\"margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums\">{{subtotal}}<\/dd>\n            <dt style=\"color:var(--muted)\">GST (18%)<\/dt><dd style=\"margin:0;text-align:right;font-weight:600;font-variant-numeric:tabular-nums\">{{gst}}<\/dd>\n          <\/dl>\n          <div style=\"border-top:1px solid var(--rule);padding-top:14px;display:flex;justify-content:space-between;align-items:baseline\"><span style=\"font-weight:600\">Total per year<\/span><b style=\"font-size:30px;letter-spacing:-.02em;font-variant-numeric:tabular-nums\">{{totalShown}}<\/b><\/div>\n          <button class=\"btn primary\" disabled=\"{{cantContinue}}\" onClick=\"{{toReview}}\">Review order →<\/button>\n          <span class=\"sub\" style=\"font-size:12px\">The amount is shown before payment. The subscription runs 12 months from purchase.<\/span>\n        <\/article>\n      <\/section>\n      <\/sc-if>\n\n      <!-- step 2 -->\n      <sc-if value=\"{{step2}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"card rise swap\" style=\"max-width:720px;padding:24px;display:flex;flex-direction:column;gap:16px\">\n        <div><h3 class=\"h2\">Review your order<\/h3><span class=\"sub\">Check the departments and the amount. Nothing is charged in this prototype.<\/span><\/div>\n        <div style=\"border:1px solid var(--rule);border-radius:12px;overflow:hidden\">\n          <sc-for list=\"{{reviewRows}}\" as=\"r\" key=\"{{r.key}}\" hint-placeholder-count=\"4\"><div class=\"row rise\" style=\"{{r.delay}};padding:10px 16px\"><span style=\"flex:1\">{{r.name}}<\/span><span style=\"font-variant-numeric:tabular-nums\">{{r.price}}<\/span><\/div><\/sc-for>\n        <\/div>\n        <dl style=\"margin:0;display:grid;grid-template-columns:1fr auto;gap:8px 12px\">\n          <dt style=\"color:var(--muted)\">Subtotal<\/dt><dd style=\"margin:0;text-align:right;font-weight:600\">{{subtotal}}<\/dd>\n          <dt style=\"color:var(--muted)\">GST (18%)<\/dt><dd style=\"margin:0;text-align:right;font-weight:600\">{{gst}}<\/dd>\n          <dt style=\"font-weight:700;font-size:16px\">Total<\/dt><dd style=\"margin:0;text-align:right;font-weight:700;font-size:22px\">{{totalShown}}<\/dd>\n        <\/dl>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap\"><button class=\"btn ghost\" onClick=\"{{toChoose}}\">← Back<\/button><button class=\"btn primary\" style=\"flex:1\" onClick=\"{{pay}}\">Confirm and pay<\/button><\/div>\n      <\/section>\n      <\/sc-if>\n\n      <!-- step 3 -->\n      <sc-if value=\"{{processing}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"card rise\" style=\"max-width:720px;padding:48px 24px;display:flex;flex-direction:column;gap:16px;align-items:center;text-align:center\"><div class=\"spin\" role=\"status\" aria-label=\"Processing\"><\/div><b>Setting up your subscription…<\/b><span class=\"sub\">This takes a moment.<\/span><\/section>\n      <\/sc-if>\n      <sc-if value=\"{{step3}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"card rise\" style=\"max-width:720px;padding:44px 24px;display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center;position:relative;overflow:hidden\">\n        <sc-for list=\"{{confetti}}\" as=\"c\" key=\"{{c.key}}\" hint-placeholder-count=\"12\"><span class=\"conf\" style=\"{{c.style}}\"><\/span><\/sc-for>\n        <span class=\"check-big\"><svg width=\"40\" height=\"40\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg><\/span>\n        <h3 style=\"margin:0;font-size:26px;letter-spacing:-.02em\">Premium is active<\/h3>\n        <p class=\"sub\" style=\"margin:0;font-size:15px\">{{paidText}}. Reading has no session limit until {{renewal}}, and analytics is open.<\/p>\n        <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:8px\"><button class=\"btn primary\" onClick=\"{{goOverview}}\">Go to the dashboard<\/button><button class=\"btn ghost\" onClick=\"{{goAnalytics}}\">Open analytics<\/button><\/div>\n      <\/section>\n      <\/sc-if>\n    <\/sc-if>\n\n    <\/div>\n  <\/main>\n<\/div>\n\n<!-- LIBRARY DEPARTMENT PANEL -->\n<sc-if value=\"{{hasPanel}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scrim\" onClick=\"{{closePanel}}\"><\/div>\n  <aside class=\"panel\" role=\"dialog\" aria-label=\"Department details\" tabindex=\"-1\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px\"><div><span class=\"eyebrow\">Department<\/span><h3 style=\"margin:2px 0 0;font-size:26px;letter-spacing:-.02em\">{{pName}}<\/h3><span class=\"sub\">{{pTotal}} items in your access<\/span><\/div><button class=\"iconbtn\" style=\"width:34px;height:34px\" onClick=\"{{closePanel}}\" aria-label=\"Close\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button><\/div>\n    <div class=\"card\" style=\"padding:18px;display:flex;flex-direction:column;gap:14px\"><b>What is inside<\/b>\n      <sc-for list=\"{{pTypes}}\" as=\"t\" hint-placeholder-count=\"3\"><div><div style=\"display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px\"><span>{{t.l}}<\/span><span class=\"sub\">{{t.n}} · {{t.pct}}%<\/span><\/div><div class=\"track\" style=\"height:8px\"><div class=\"seg-bar\" style=\"{{t.style}}\"><\/div><\/div><\/div><\/sc-for>\n    <\/div>\n    <div class=\"card\" style=\"overflow:hidden\"><div style=\"padding:16px 18px\"><b>Sample titles<\/b><div class=\"sub\" style=\"font-size:12px\">The real list loads from the library.<\/div><\/div>\n      <sc-for list=\"{{pTitles}}\" as=\"t\" hint-placeholder-count=\"3\"><button class=\"row rise\" style=\"{{t.delay}}\" onClick=\"{{t.open}}\"><span style=\"flex:1;min-width:0;font-weight:600\">{{t.t}}<\/span><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--faint)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button><\/sc-for>\n    <\/div>\n    <button class=\"btn primary\" style=\"margin-top:auto\" onClick=\"{{closePanel}}\">Open in the library<\/button>\n  <\/aside>\n<\/sc-if>\n\n<!-- ADD USER DRAWER -->\n<sc-if value=\"{{drawer}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scrim\" onClick=\"{{closeDrawer}}\"><\/div>\n  <aside class=\"drawer\" role=\"dialog\" aria-label=\"Add a user\" onKeyDown=\"{{drawerKey}}\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-start;gap:12px\"><div><h3 style=\"margin:0;font-size:20px;letter-spacing:-.02em\">Add a user<\/h3><span class=\"sub\">They get an email to set a password.<\/span><\/div><button class=\"iconbtn\" style=\"width:34px;height:34px\" onClick=\"{{closeDrawer}}\" aria-label=\"Close\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button><\/div>\n    <div class=\"two\">\n      <label class=\"{{nameCls}}\"><span>Full name <span class=\"req\">*<\/span><\/span><input type=\"text\" autofocus=\"true\" value=\"{{fName}}\" onInput=\"{{setName}}\" placeholder=\"User name\"><span class=\"msg\">{{errName}}<\/span><\/label>\n      <label class=\"{{emailCls}}\"><span>Email <span class=\"req\">*<\/span><\/span><input type=\"email\" value=\"{{fEmail}}\" onInput=\"{{setEmail}}\" placeholder=\"user@university.edu\"><span class=\"msg\">{{errEmail}}<\/span><\/label>\n    <\/div>\n    <label class=\"{{mobileCls}}\">Mobile number<input type=\"tel\" value=\"{{fMobile}}\" onInput=\"{{setMobile}}\" placeholder=\"+91 9876543210\"><span class=\"msg\">{{errMobile}}<\/span><\/label>\n    <div class=\"field\"><span>Account type <span class=\"req\">*<\/span><\/span>\n      <div class=\"seg\" role=\"group\" aria-label=\"Account type\" style=\"align-self:flex-start\"><sc-for list=\"{{acctOpts}}\" as=\"a\" hint-placeholder-count=\"3\"><button class=\"{{a.cls}}\" aria-pressed=\"{{a.pressed}}\" onClick=\"{{a.pick}}\"><sc-if value=\"{{a.locked}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 11V8a4 4 0 118 0v3\"><\/path><\/svg><\/sc-if>{{a.name}}<sc-if value=\"{{a.locked}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"pro\">PRO<\/span><\/sc-if><\/button><\/sc-for><\/div>\n      <span class=\"hintline\">How this person uses the library. It decides what the account can do; their professional designation below does not.<\/span>\n    <\/div>\n    <div class=\"field\"><span>Professional designation <span class=\"req\">*<\/span><\/span>\n      <div style=\"display:flex;flex-wrap:wrap;gap:8px\"><sc-for list=\"{{desigOpts}}\" as=\"d\" key=\"{{d.name}}\" hint-placeholder-count=\"4\"><button class=\"{{d.cls}}\" aria-pressed=\"{{d.pressed}}\" onClick=\"{{d.pick}}\"><svg class=\"tick\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg>{{d.name}}<\/button><\/sc-for><\/div>\n      <span class=\"msg\" style=\"color:var(--alarm);font-weight:500;font-size:12px\">{{errDesig}}<\/span>\n      <span class=\"hintline\">The list follows the account type. A title never changes what the person can open.<\/span>\n    <\/div>\n    <div class=\"two\">\n      <label class=\"field\">Branch<input type=\"text\" value=\"{{fBranch}}\" onInput=\"{{setBranch}}\" placeholder=\"e.g. Computer Science\"><\/label>\n      <label class=\"field\">Department<input type=\"text\" value=\"{{fDept}}\" onInput=\"{{setDept}}\" placeholder=\"e.g. Engineering\"><\/label>\n    <\/div>\n    <label class=\"{{passCls}}\"><span>Temporary password <span class=\"req\">*<\/span><\/span>\n      <span class=\"pwrap\"><input type=\"{{passType}}\" value=\"{{fPass}}\" onInput=\"{{setPass}}\" placeholder=\"At least 8 characters\" autocomplete=\"new-password\"><button type=\"button\" onClick=\"{{togglePass}}\" aria-label=\"{{passLabel}}\"><sc-if value=\"{{showPass}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 3l18 18M10.6 6.1A10 10 0 0112 6c6 0 9.5 6 9.5 6a17 17 0 01-3.1 3.8M6.6 6.7C3.9 8.5 2.5 12 2.5 12S6 18 12 18c1.5 0 2.9-.4 4-1\"><\/path><\/svg><\/sc-if><sc-if value=\"{{hidePass}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2.5 12S6 6 12 6s9.5 6 9.5 6-3.5 6-9.5 6S2.5 12 2.5 12z\"><\/path><circle cx=\"12\" cy=\"12\" r=\"3\"><\/circle><\/svg><\/sc-if><\/button><\/span>\n      <span class=\"msg\">{{errPass}}<\/span><span class=\"hintline\">They are asked to change it the first time they sign in.<\/span>\n    <\/label>\n    <div style=\"margin-top:auto;display:flex;gap:10px\"><button class=\"btn primary\" style=\"flex:1\" onClick=\"{{submitUser}}\">Add user<\/button><button class=\"btn ghost\" onClick=\"{{closeDrawer}}\">Cancel<\/button><\/div>\n  <\/aside>\n<\/sc-if>\n\n<!-- COMMAND PALETTE -->\n<sc-if value=\"{{palette}}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"scrim\" style=\"z-index:100\" onClick=\"{{closePalette}}\"><\/div>\n  <div class=\"palette\" role=\"dialog\" aria-label=\"Search\">\n    <input type=\"text\" autofocus=\"true\" value=\"{{pq}}\" onInput=\"{{setPq}}\" onKeyDown=\"{{palKey}}\" placeholder=\"Search pages, departments and members…\" aria-label=\"Search pages, departments and members\">\n    <div style=\"max-height:min(52vh,420px);overflow-y:auto;padding:6px 0\">\n      <sc-for list=\"{{palItems}}\" as=\"it\" key=\"{{it.key}}\" hint-placeholder-count=\"5\"><button class=\"{{it.cls}}\" onMouseEnter=\"{{it.hover}}\" onClick=\"{{it.pick}}\"><span style=\"min-width:0;text-align:left\"><b style=\"display:block;font-weight:600\">{{it.label}}<\/b><span class=\"sub\" style=\"font-size:12px\">{{it.sub}}<\/span><\/span><span class=\"pal-kind\">{{it.kind}}<\/span><\/button><\/sc-for>\n      <sc-if value=\"{{palEmpty}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"sub\" style=\"padding:24px;text-align:center\">Nothing matches. Try a member's name or a department.<\/div><\/sc-if>\n    <\/div>\n    <div class=\"sub\" style=\"padding:10px 20px;border-top:1px solid var(--rule);font-size:12px\">↑ ↓ to move · Enter to open · Esc to close<\/div>\n  <\/div>\n<\/sc-if>\n\n<sc-if value=\"{{toast}}\" hint-placeholder-val=\"{{ false }}\"><div class=\"toast\" role=\"status\"><span>{{toast}}<\/span><sc-if value=\"{{hasToastAct}}\" hint-placeholder-val=\"{{ false }}\"><button onClick=\"{{toastAct}}\">{{toastLabel}}<\/button><\/sc-if><\/div><\/sc-if>\n\n<\/div>\n", code: "const IN = (n) => Number(n).toLocaleString('en-IN');\nconst rupee = (n) => '₹' + IN(n);\nconst hash = (s) => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);\nconst rnd = (n) => { const x = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return x - Math.floor(x); };\n\nconst GROUPS = [\n  ['Engineering & Technology', ['Applied Mechanics', 'Chemical Engineering', 'Civil / Construction Engineering', 'Computer / IT', 'Electrical Engineering', 'Electronics & Telecommunication Engineering', 'Energy', 'Material Science', 'Mechanical Engineering', 'Nano Technology']],\n  ['Medical & Health Sciences', ['Ayurveda', 'Dental', 'Medical Sciences', 'Nursing', 'Pharmacy', 'Physiotherapy']],\n  ['Life Sciences & Biotechnology', ['Bio Technology', 'Life Sciences']],\n  ['Science & Applied Sciences', ['Applied Sciences', 'Chemistry', 'Science']],\n  ['Business & Management', ['Commerce', 'Management']],\n  ['Social Sciences, Education & Humanities', ['Arts', 'Education and Social Sciences', 'Law']],\n  ['Agriculture & Allied Sciences', ['Agriculture']],\n  ['Architecture & Built Environment', ['Architecture']],\n  ['Multidisciplinary', ['Multidisciplinary']],\n];\nconst HELD0 = ['Agriculture', 'Applied Mechanics', 'Applied Sciences', 'Architecture'];\n// The first four are the figures on the real dashboard (they add up to 79,099); the rest are sample numbers so a bigger plan has something to show.\nconst TOTAL = { Agriculture: 29366, 'Applied Mechanics': 4042, 'Applied Sciences': 17514, Architecture: 28177, Arts: 9840, Ayurveda: 3120, 'Bio Technology': 11260, 'Chemical Engineering': 8890, Chemistry: 14230, 'Civil / Construction Engineering': 12470, Commerce: 7650, 'Computer / IT': 31880, Dental: 2950, 'Education and Social Sciences': 16340, 'Electrical Engineering': 10920, 'Electronics & Telecommunication Engineering': 9410, Energy: 6180, Law: 8330, 'Life Sciences': 19760, Management: 13540, 'Material Science': 7020, 'Mechanical Engineering': 11890, 'Medical Sciences': 27640, Multidisciplinary: 5210, 'Nano Technology': 3870, Nursing: 4460, Pharmacy: 9120, Physiotherapy: 2380, Science: 15600 };\nconst PAGES = [['overview', 'Dashboard overview'], ['users', 'User management'], ['analytics', 'Learning analytics'], ['library', 'Content library'], ['subs', 'Subscriptions']];\nconst TITLES = { overview: 'Dashboard', users: 'User management', library: 'Content library', analytics: 'Learning analytics', subs: 'Subscriptions' };\n\nconst MEMBERS = [\n  { id: 'm1', name: 'Ananya Rao', email: 'ananya.rao@example.edu', type: 'Faculty', desig: 'Lecturer', status: 'Reading', sessions: 14, last: '2 hours ago', items: ['Journal of Design Thinking', 'Animals and Zoonoses'] },\n  { id: 'm2', name: 'Rohan Mehta', email: 'rohan.mehta@example.edu', type: 'Researcher', desig: 'Associate Professor', status: 'Not started', sessions: 0, last: 'Never signed in', items: [] },\n  { id: 'm3', name: 'Meera Iyer', email: 'meera.iyer@example.edu', type: 'Faculty', desig: 'Professor', status: 'Reading', sessions: 9, last: 'Yesterday', items: ['Agricultural Science and Technology'] },\n  { id: 'm4', name: 'Karan Shah', email: 'karan.shah@example.edu', type: 'Student', desig: 'PhD Scholar', status: 'Reading', sessions: 6, last: '3 days ago', items: ['Journal of Design Thinking'] },\n  { id: 'm5', name: 'Sana Qureshi', email: 'sana.qureshi@example.edu', type: 'Researcher', desig: 'Research Associate', status: 'Reading', sessions: 3, last: '5 days ago', items: ['Animals and Zoonoses'] },\n  { id: 'm6', name: 'Vikram Nair', email: 'vikram.nair@example.edu', type: 'Student', desig: \"Master's Student\", status: 'Not started', sessions: 0, last: 'Never signed in', items: [] },\n  { id: 'm7', name: 'Priya Das', email: 'priya.das@example.edu', type: 'Faculty', desig: 'Assistant Professor', status: 'Invited', sessions: 0, last: 'Invited today', items: [] },\n  { id: 'm8', name: 'Dev Malhotra', email: 'dev.malhotra@example.edu', type: 'Student', desig: 'Undergraduate Student', status: 'Reading', sessions: 11, last: 'Today', items: ['Agricultural Science and Technology', 'Journal of Design Thinking'] },\n];\nconst ACCT = { Faculty: ['Professor', 'Associate Professor', 'Assistant Professor', 'Lecturer'], Researcher: ['Research Scientist', 'Research Associate', 'Research Fellow', 'Scientist'], Student: ['Undergraduate Student', \"Master's Student\", 'PhD Scholar'] };\nconst NOTIFS = [\n  { id: 'n1', title: 'Ananya Rao opened Journal of Design Thinking', when: '2 hours ago' },\n  { id: 'n2', title: 'Rohan Mehta and Vikram Nair have not signed in yet', when: 'This week' },\n  { id: 'n3', title: 'Your free-preview session clock resets when the countdown ends', when: 'Today' },\n];\nconst UNFOUND = [['quantum sensing in agriculture', 6], ['bridge fatigue testing', 4], ['adaptive thermal comfort', 4], ['urban heat island mitigation', 3], ['soil carbon sequestration', 2]];\nconst SAMPLE_TITLES = { Agriculture: ['Agricultural Science and Technology', 'Animals and Zoonoses', 'Annals of Agriculture'], 'Applied Sciences': ['Journal of Design Thinking', 'Applied Sciences Research Letters', 'Advances in Applied Sciences'] };\nconst titlesOf = (d) => SAMPLE_TITLES[d] || ['Advances in ' + d, d + ' Research Letters', 'Annals of ' + d];\nconst splitOf = (d) => { const h = hash(d); const a = 58 + (h % 24), b = 14 + (h % 9); ret
