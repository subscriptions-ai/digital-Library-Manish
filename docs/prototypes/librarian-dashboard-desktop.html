<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Librarian dashboard prototype (desktop)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0}
.app{--ground:#f6f6f4;--surface:#ffffff;--surface-2:#f0f0ed;--ink:#16181d;--ink-2:#3d434b;--muted:#5f656c;--faint:#9aa0a6;--rule:#e0e0dc;--rule-2:#cfcfc9;--accent:#0d5c63;--accent-soft:#e2eeee;--btn:#0d5c63;--btn-ink:#ffffff;--side-card:#0d5c63;--caution:#a1480a;--caution-soft:#fbf0e0;--success:#1d6b43;--success-soft:#e3f2e9;--alarm:#a3302a;--alarm-soft:#fbeceb;--s1:#00909c;--s2:#b5651a;--s3:#7050d0;--navy:#0b1b3a;--amber:#f5b301;--shadow:0 1px 2px rgba(22,24,29,.05);--pop:0 12px 32px rgba(22,24,29,.14);
  font-family:'Inter',system-ui,sans-serif;background:var(--ground);color:var(--ink);font-size:14px;line-height:1.5;transition:background .35s ease,color .35s ease;min-height:100%}
.app.dark{--ground:#0a111e;--surface:#111a2b;--surface-2:#172338;--ink:#e9edf4;--ink-2:#c5ccd8;--muted:#98a5b9;--faint:#66748a;--rule:#223049;--rule-2:#2d3d59;--accent:#4cc0c9;--accent-soft:#123a43;--btn:#34a9b3;--btn-ink:#04191c;--side-card:#0f3f47;--caution:#f0b46a;--caution-soft:#3a2a12;--success:#69d29a;--success-soft:#12301f;--alarm:#f08a84;--alarm-soft:#3a1a19;--s1:#2fc1cf;--s2:#e1923f;--s3:#a28cff;--shadow:none;--pop:0 12px 32px rgba(0,0,0,.5)}
.app *{box-sizing:border-box}
:where(.app) button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
.app button:focus-visible,.app input:focus-visible,.app [tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app button:disabled{cursor:not-allowed;opacity:.5}
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--rule);padding:16px 12px;display:flex;flex-direction:column;gap:6px;transition:flex-basis .3s cubic-bezier(.2,.8,.2,1),background .35s}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}
.side.collapsed .lbl,.side.collapsed .side-card,.side.collapsed .menu-h,.side.collapsed .brand-name,.side.collapsed .nav-badge{display:none}
.side.collapsed .nav,.side.collapsed .signout{justify-content:center;padding-left:0;padding-right:0}
.menu-h{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);padding:6px 10px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;position:relative;transition:background .2s,color .2s,transform .2s}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav:hover svg{transform:scale(1.12)}
.nav svg{flex:none;transition:transform .2s}
.nav.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);animation:growY .35s ease both}
.nav-badge{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--caution);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.side-card{margin-top:auto;background:var(--side-card);color:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:background .5s}
.side-card small{font-size:11px;letter-spacing:.1em;font-weight:600;opacity:.8}
.side-card button{margin-top:6px;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:9px;font-weight:600;transition:background .2s;text-align:center}
.side-card button:hover{background:rgba(255,255,255,.26)}
.signout{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--rule);margin-top:6px;color:var(--ink-2);width:100%}
/* topbar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 28px;min-height:64px;background:var(--surface);border-bottom:1px solid var(--rule);transition:background .35s;position:relative;z-index:30}
.search{flex:1 1 220px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2)!important;border:1px solid var(--rule)!important;border-radius:10px;padding:0 10px 0 12px;height:40px;color:var(--muted);transition:border-color .2s,box-shadow .2s}
.search:hover{border-color:var(--accent)!important}
.kbd{margin-left:auto;font-size:11px;font-weight:600;border:1px solid var(--rule-2);border-radius:6px;padding:1px 6px;background:var(--surface);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.amber{background:var(--caution-soft);color:var(--caution);border:1px solid color-mix(in srgb,var(--caution) 35%,transparent)}
.pill.green{background:var(--success-soft);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 35%,transparent)}
.pill.teal{background:var(--accent-soft);color:var(--accent)}
.pill.sample{background:var(--surface-2)!important;color:var(--muted);border:1px dashed var(--rule-2)!important}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule)!important;display:grid;place-items:center;background:var(--surface)!important;color:var(--ink-2);transition:transform .2s,background .2s;position:relative;text-align:center}
.iconbtn:hover{background:var(--surface-2)!important;transform:translateY(-1px)}
.bell-dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--alarm);border:2px solid var(--surface);animation:beat 2s ease-in-out infinite}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pop{position:absolute;top:52px;right:0;width:min(340px,92vw);background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--pop);z-index:50;animation:popIn .22s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right;overflow:hidden}
.pop .pi{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--rule);width:100%;transition:background .2s}
.pop .pi:hover{background:var(--surface-2)}
/* content */
.content{padding:26px 28px 64px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .35s}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--pop);border-color:var(--rule-2)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0}
.h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;font-weight:600;transition:transform .2s,box-shadow .2s,background .2s,opacity .2s;text-align:center}
.btn.primary{background:var(--btn)!important;color:var(--btn-ink)!important}
.btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--btn) 35%,transparent)}
.btn.primary:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface)!important;border:1px solid var(--rule-2)!important;color:var(--ink)!important}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)!important}
.btn.danger{background:var(--alarm-soft)!important;color:var(--alarm)!important}
.btn.amber{background:var(--amber)!important;color:#1a1200!important}
.btn.amber:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(245,179,1,.35)}
.btn.light{background:rgba(255,255,255,.1)!important;color:#fff!important;border:1px solid rgba(255,255,255,.25)!important}
.btn.sm{min-height:34px;padding:0 12px;border-radius:9px;font-size:13px}
.link{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:gap .2s}
.link:hover{text-decoration:underline;gap:9px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule)!important;background:var(--surface-2)!important;color:var(--ink-2);font-size:13px;font-weight:500;transition:transform .15s,background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--accent)!important;transform:translateY(-1px)}
.chip.on{background:var(--accent-soft)!important;border-color:var(--accent)!important;color:var(--accent);font-weight:600}
.chip .tick{width:0;height:14px;transition:width .2s}
.chip.on .tick{width:14px;animation:pop .25s ease both}
.dot{width:8px;height:8px;border-radius:50%;background:var(--caution);display:inline-block;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--caution);opacity:0;animation:ping 1.8s ease-out infinite}
.dot.live{background:var(--success)}.dot.live::after{border-color:var(--success)}
.track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.seg-bar{height:100%;transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both;transition:width .5s cubic-bezier(.2,.8,.2,1),opacity .2s;cursor:pointer}
.seg-bar:hover{opacity:.82}
.rise{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.wait{background:var(--caution-soft);color:var(--caution)}
.tag.fac{background:var(--accent-soft);color:var(--accent)}
.tag.mute{background:var(--surface-2);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--rule);transition:background .2s;width:100%}
.row:hover{background:var(--surface-2)}
.tile{display:flex;gap:12px;padding:16px;text-align:left;width:100%;height:100%}
.tile .ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .3s}
.tile:hover .ico{transform:rotate(-8deg) scale(1.08)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.field input,.inp{height:44px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-weight:400;width:100%}
.field.err input{border-color:var(--alarm);animation:shake .35s ease}
.field .msg{color:var(--alarm);font-weight:500;font-size:12px}
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.5);animation:fadeIn .25s ease both;z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--pop);z-index:81;padding:24px;display:flex;flex-direction:column;gap:18px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 12px 10px 18px;font-weight:600;z-index:120;animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:var(--pop);display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{color:var(--amber);font-weight:700;padding:6px 10px;border-radius:8px}
.toast button:hover{background:rgba(255,255,255,.12)}
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.35);z-index:101;overflow:hidden;animation:palIn .22s cubic-bezier(.2,.8,.2,1) both}
.palette input{width:100%;height:56px;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:0 20px;outline:none}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 20px;transition:background .12s}
.pal-item.on{background:var(--accent-soft)}
.pal-kind{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* charts */
.plot{position:relative;height:230px;margin-left:34px}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.gridlbl{position:absolute;left:-34px;width:28px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.hit{position:absolute;top:0;bottom:0;cursor:crosshair}
.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--rule-2);pointer-events:none}
.pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--s1);transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--s1) 20%,transparent);animation:pop .2s ease both}
.tip{position:absolute;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;transform:translate(-50%,-130%);animation:fadeIn .15s ease both;z-index:5}
.area{opacity:0;animation:fadeIn .8s ease .5s forwards}
.line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.donut{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut.dim{opacity:.25}
.legend{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-2);transition:background .2s,opacity .2s}
.legend:hover{background:var(--surface-2)}
.legend.off{opacity:.4;text-decoration:line-through}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{width:100%;aspect-ratio:1.5;min-height:22px;border-radius:5px;animation:fadeIn .4s ease both;transition:transform .12s,outline-color .12s;outline:2px solid transparent;cursor:pointer}
.heat:hover{transform:scale(1.18);outline-color:var(--ink)}
/* skeleton */
.skel{background:linear-gradient(100deg,var(--surface-2) 30%,color-mix(in srgb,var(--surface-2) 55%,var(--surface)) 50%,var(--surface-2) 70%);background-size:220% 100%;animation:skel 1.2s linear infinite;border-radius:14px}
.shimmer{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 2.4s linear infinite}
/* subs */
.tier{flex:1;min-width:84px;border:1px solid var(--rule);border-radius:12px;padding:10px;text-align:center;background:var(--surface);transition:transform .25s,border-color .25s,background .25s}
.tier.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-3px)}
.stepper{display:flex;align-items:center;gap:0}
.st{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.st .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--rule-2);font-size:12px;transition:all .3s;background:var(--surface)}
.st.on{color:var(--ink)}.st.on .n{border-color:var(--accent);background:var(--accent);color:var(--btn-ink)}
.st.done .n{background:var(--success);border-color:var(--success);color:#fff}
.stline{flex:1;height:2px;background:var(--rule);margin:0 12px;min-width:24px;position:relative;overflow:hidden;border-radius:2px}
.stline i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--accent));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--rule);border-top-color:var(--accent);animation:spin .8s linear infinite}
.check-big{width:84px;height:84px;border-radius:50%;background:var(--success-soft);display:grid;place-items:center;color:var(--success);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.check-big path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw30 .6s ease .35s forwards}
.conf{position:absolute;left:50%;top:84px;width:9px;height:14px;border-radius:2px;animation:conf 1.4s cubic-bezier(.2,.7,.3,1) both;pointer-events:none}
.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes draw30{to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes pop{from{transform:translate(var(--tx,0),var(--ty,0)) scale(0)}to{transform:translate(var(--tx,0),var(--ty,0)) scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes palIn{from{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.97)}to{opacity:1;transform:translateX(-50%)}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes skel{from{background-position:200% 0}to{background-position:-20% 0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swap{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr));opacity:0}}
@media (prefers-reduced-motion:reduce){.app *,.app *::before,.app *::after{animation:none!important;transition:none!important}.line{stroke-dashoffset:0}.area{opacity:1}}
.pt{--tx:-50%;--ty:-50%}
.stat{padding:16px;text-align:left;width:100%;display:block;cursor:pointer}
.stat.on{border-color:var(--accent);background:var(--accent-soft)}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--rule-2);display:grid;place-items:center;color:transparent;transition:all .15s;flex:none;background:var(--surface)!important}
.cb.on{background:var(--accent)!important;border-color:var(--accent);color:var(--btn-ink)}
.stp{display:flex;align-items:center;gap:10px;padding:5px 8px;margin:0 -8px;border-radius:8px;width:100%;transition:background .2s}
.stp:hover{background:var(--surface-2)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;animation:fadeUp .3s cubic-bezier(.2,.8,.2,1) both}
.bulk .btn.ghost{background:transparent!important;color:var(--surface)!important;border-color:rgba(255,255,255,.3)!important}
.lock-preview{filter:blur(4px);opacity:.8;pointer-events:none;user-select:none;transition:filter .6s,opacity .6s}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:6px 18px 18px 52px;animation:swap .3s ease both}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--pop);z-index:81;padding:26px;display:flex;flex-direction:column;gap:20px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both;overflow-y:auto}
.ev{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--rule);animation:evIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes evIn{from{opacity:0;transform:translateY(-12px);background:var(--accent-soft)}to{opacity:1;transform:none}}
.app{color-scheme:light}.app.dark{color-scheme:dark}
html:has(.app.dark){color-scheme:dark}

.side-nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.side-foot{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:8px}
@media (min-width:840px){.side{position:sticky;top:0;height:100vh;align-self:flex-start;overflow:hidden}}
.pro{font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--amber);color:#1a1200;border-radius:6px;padding:1px 6px;margin-left:2px}
.seg button.locked{color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pwrap{position:relative}.pwrap input{padding-right:46px}
.pwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.pwrap button:hover{background:var(--surface-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hintline{font-weight:400;font-size:12px;color:var(--muted)}
.req{color:var(--alarm)}

body{margin:0}
.app{--ground:#f6f6f4;--surface:#ffffff;--surface-2:#f0f0ed;--ink:#16181d;--ink-2:#3d434b;--muted:#5f656c;--faint:#9aa0a6;--rule:#e0e0dc;--rule-2:#cfcfc9;--accent:#0d5c63;--accent-soft:#e2eeee;--btn:#0d5c63;--btn-ink:#ffffff;--side-card:#0d5c63;--caution:#a1480a;--caution-soft:#fbf0e0;--success:#1d6b43;--success-soft:#e3f2e9;--alarm:#a3302a;--alarm-soft:#fbeceb;--s1:#00909c;--s2:#b5651a;--s3:#7050d0;--navy:#0b1b3a;--amber:#f5b301;--shadow:0 1px 2px rgba(22,24,29,.05);--pop:0 12px 32px rgba(22,24,29,.14);
  font-family:'Inter',system-ui,sans-serif;background:var(--ground);color:var(--ink);font-size:14px;line-height:1.5;transition:background .35s ease,color .35s ease;min-height:100%}
.app.dark{--ground:#0a111e;--surface:#111a2b;--surface-2:#172338;--ink:#e9edf4;--ink-2:#c5ccd8;--muted:#98a5b9;--faint:#66748a;--rule:#223049;--rule-2:#2d3d59;--accent:#4cc0c9;--accent-soft:#123a43;--btn:#34a9b3;--btn-ink:#04191c;--side-card:#0f3f47;--caution:#f0b46a;--caution-soft:#3a2a12;--success:#69d29a;--success-soft:#12301f;--alarm:#f08a84;--alarm-soft:#3a1a19;--s1:#2fc1cf;--s2:#e1923f;--s3:#a28cff;--shadow:none;--pop:0 12px 32px rgba(0,0,0,.5)}
.app *{box-sizing:border-box}
:where(.app) button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;text-align:inherit}
.app button:focus-visible,.app input:focus-visible,.app [tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app button:disabled{cursor:not-allowed;opacity:.5}
.shell{display:flex;flex-wrap:wrap;align-items:stretch;min-height:100vh}
/* sidebar */
.side{background:var(--surface);border-right:1px solid var(--rule);padding:16px 12px;display:flex;flex-direction:column;gap:6px;transition:flex-basis .3s cubic-bezier(.2,.8,.2,1),background .35s}
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 14px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}
.side.collapsed .lbl,.side.collapsed .side-card,.side.collapsed .menu-h,.side.collapsed .brand-name,.side.collapsed .nav-badge{display:none}
.side.collapsed .nav,.side.collapsed .signout{justify-content:center;padding-left:0;padding-right:0}
.menu-h{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--muted);padding:6px 10px}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border-radius:10px;color:var(--ink-2);font-weight:500;position:relative;transition:background .2s,color .2s,transform .2s}
.nav:hover{background:var(--surface-2);color:var(--ink)}
.nav:hover svg{transform:scale(1.12)}
.nav svg{flex:none;transition:transform .2s}
.nav.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav.active::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);animation:growY .35s ease both}
.nav-badge{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--caution);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.side-card{margin-top:auto;background:var(--side-card);color:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;transition:background .5s}
.side-card small{font-size:11px;letter-spacing:.1em;font-weight:600;opacity:.8}
.side-card button{margin-top:6px;background:rgba(255,255,255,.16);color:#fff;border-radius:9px;padding:9px;font-weight:600;transition:background .2s;text-align:center}
.side-card button:hover{background:rgba(255,255,255,.26)}
.signout{display:flex;align-items:center;gap:12px;padding:10px 12px;border-top:1px solid var(--rule);margin-top:6px;color:var(--ink-2);width:100%}
/* topbar */
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 28px;min-height:64px;background:var(--surface);border-bottom:1px solid var(--rule);transition:background .35s;position:relative;z-index:30}
.search{flex:1 1 220px;max-width:420px;display:flex;align-items:center;gap:8px;background:var(--surface-2)!important;border:1px solid var(--rule)!important;border-radius:10px;padding:0 10px 0 12px;height:40px;color:var(--muted);transition:border-color .2s,box-shadow .2s}
.search:hover{border-color:var(--accent)!important}
.kbd{margin-left:auto;font-size:11px;font-weight:600;border:1px solid var(--rule-2);border-radius:6px;padding:1px 6px;background:var(--surface);color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.amber{background:var(--caution-soft);color:var(--caution);border:1px solid color-mix(in srgb,var(--caution) 35%,transparent)}
.pill.green{background:var(--success-soft);color:var(--success);border:1px solid color-mix(in srgb,var(--success) 35%,transparent)}
.pill.teal{background:var(--accent-soft);color:var(--accent)}
.pill.sample{background:var(--surface-2)!important;color:var(--muted);border:1px dashed var(--rule-2)!important}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule)!important;display:grid;place-items:center;background:var(--surface)!important;color:var(--ink-2);transition:transform .2s,background .2s;position:relative;text-align:center}
.iconbtn:hover{background:var(--surface-2)!important;transform:translateY(-1px)}
.bell-dot{position:absolute;top:7px;right:8px;width:9px;height:9px;border-radius:50%;background:var(--alarm);border:2px solid var(--surface);animation:beat 2s ease-in-out infinite}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.pop{position:absolute;top:52px;right:0;width:min(340px,92vw);background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--pop);z-index:50;animation:popIn .22s cubic-bezier(.2,.8,.2,1) both;transform-origin:top right;overflow:hidden}
.pop .pi{display:flex;gap:10px;padding:12px 14px;border-top:1px solid var(--rule);width:100%;transition:background .2s}
.pop .pi:hover{background:var(--surface-2)}
/* content */
.content{padding:26px 28px 64px;display:flex;flex-direction:column;gap:22px;max-width:1240px;width:100%}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s,border-color .25s,background .35s}
.card.lift:hover{transform:translateY(-3px);box-shadow:var(--pop);border-color:var(--rule-2)}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.h1{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.025em;margin:0}
.h2{font-size:15px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:13px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:11px;font-weight:600;transition:transform .2s,box-shadow .2s,background .2s,opacity .2s;text-align:center}
.btn.primary{background:var(--btn)!important;color:var(--btn-ink)!important}
.btn.primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 8px 18px color-mix(in srgb,var(--btn) 35%,transparent)}
.btn.primary:active:not(:disabled){transform:translateY(0) scale(.98)}
.btn.ghost{background:var(--surface)!important;border:1px solid var(--rule-2)!important;color:var(--ink)!important}
.btn.ghost:hover:not(:disabled){background:var(--surface-2)!important}
.btn.danger{background:var(--alarm-soft)!important;color:var(--alarm)!important}
.btn.amber{background:var(--amber)!important;color:#1a1200!important}
.btn.amber:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(245,179,1,.35)}
.btn.light{background:rgba(255,255,255,.1)!important;color:#fff!important;border:1px solid rgba(255,255,255,.25)!important}
.btn.sm{min-height:34px;padding:0 12px;border-radius:9px;font-size:13px}
.link{color:var(--accent);font-weight:600;display:inline-flex;align-items:center;gap:6px;transition:gap .2s}
.link:hover{text-decoration:underline;gap:9px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:8px;font-weight:600;font-size:12px;color:var(--muted);transition:background .2s,color .2s}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--rule)!important;background:var(--surface-2)!important;color:var(--ink-2);font-size:13px;font-weight:500;transition:transform .15s,background .2s,border-color .2s,color .2s}
.chip:hover{border-color:var(--accent)!important;transform:translateY(-1px)}
.chip.on{background:var(--accent-soft)!important;border-color:var(--accent)!important;color:var(--accent);font-weight:600}
.chip .tick{width:0;height:14px;transition:width .2s}
.chip.on .tick{width:14px;animation:pop .25s ease both}
.dot{width:8px;height:8px;border-radius:50%;background:var(--caution);display:inline-block;position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--caution);opacity:0;animation:ping 1.8s ease-out infinite}
.dot.live{background:var(--success)}.dot.live::after{border-color:var(--success)}
.track{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden;display:flex}
.seg-bar{height:100%;transform-origin:left;animation:growX .9s cubic-bezier(.2,.8,.2,1) both;transition:width .5s cubic-bezier(.2,.8,.2,1),opacity .2s;cursor:pointer}
.seg-bar:hover{opacity:.82}
.rise{animation:fadeUp .55s cubic-bezier(.2,.8,.2,1) both}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tag.ok{background:var(--success-soft);color:var(--success)}
.tag.wait{background:var(--caution-soft);color:var(--caution)}
.tag.fac{background:var(--accent-soft);color:var(--accent)}
.tag.mute{background:var(--surface-2);color:var(--muted)}
.row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--rule);transition:background .2s;width:100%}
.row:hover{background:var(--surface-2)}
.tile{display:flex;gap:12px;padding:16px;text-align:left;width:100%;height:100%}
.tile .ico{width:38px;height:38px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;transition:transform .3s}
.tile:hover .ico{transform:rotate(-8deg) scale(1.08)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:13px}
.field input,.inp{height:44px;border-radius:10px;border:1px solid var(--rule-2);background:var(--surface);color:var(--ink);padding:0 12px;font:inherit;font-weight:400;width:100%}
.field.err input{border-color:var(--alarm);animation:shake .35s ease}
.field .msg{color:var(--alarm);font-weight:500;font-size:12px}
.scrim{position:fixed;inset:0;background:rgba(8,14,26,.5);animation:fadeIn .25s ease both;z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--pop);z-index:81;padding:24px;display:flex;flex-direction:column;gap:18px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--surface);border-radius:12px;padding:10px 12px 10px 18px;font-weight:600;z-index:120;animation:toastIn .35s cubic-bezier(.2,.8,.2,1) both;box-shadow:var(--pop);display:flex;gap:14px;align-items:center;max-width:92vw}
.toast button{color:var(--amber);font-weight:700;padding:6px 10px;border-radius:8px}
.toast button:hover{background:rgba(255,255,255,.12)}
.palette{position:fixed;top:12vh;left:50%;transform:translateX(-50%);width:min(620px,94vw);background:var(--surface);border:1px solid var(--rule);border-radius:16px;box-shadow:0 30px 70px rgba(0,0,0,.35);z-index:101;overflow:hidden;animation:palIn .22s cubic-bezier(.2,.8,.2,1) both}
.palette input{width:100%;height:56px;border:0;border-bottom:1px solid var(--rule);background:transparent;color:var(--ink);font:inherit;font-size:16px;padding:0 20px;outline:none}
.pal-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px 20px;transition:background .12s}
.pal-item.on{background:var(--accent-soft)}
.pal-kind{margin-left:auto;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
/* charts */
.plot{position:relative;height:230px;margin-left:34px}
.gridline{position:absolute;left:0;right:0;border-top:1px dashed var(--rule)}
.gridlbl{position:absolute;left:-34px;width:28px;text-align:right;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.hit{position:absolute;top:0;bottom:0;cursor:crosshair}
.cross{position:absolute;top:0;bottom:0;width:1px;background:var(--rule-2);pointer-events:none}
.pt{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--s1);transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--s1) 20%,transparent);animation:pop .2s ease both}
.tip{position:absolute;background:var(--ink);color:var(--surface);border-radius:10px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;pointer-events:none;transform:translate(-50%,-130%);animation:fadeIn .15s ease both;z-index:5}
.area{opacity:0;animation:fadeIn .8s ease .5s forwards}
.line{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) forwards}
.donut{transition:opacity .2s,stroke-width .2s;cursor:pointer}
.donut.dim{opacity:.25}
.legend{display:inline-flex;align-items:center;gap:7px;padding:4px 9px;border-radius:8px;font-size:12px;font-weight:600;color:var(--ink-2);transition:background .2s,opacity .2s}
.legend:hover{background:var(--surface-2)}
.legend.off{opacity:.4;text-decoration:line-through}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat{width:100%;aspect-ratio:1.5;min-height:22px;border-radius:5px;animation:fadeIn .4s ease both;transition:transform .12s,outline-color .12s;outline:2px solid transparent;cursor:pointer}
.heat:hover{transform:scale(1.18);outline-color:var(--ink)}
/* skeleton */
.skel{background:linear-gradient(100deg,var(--surface-2) 30%,color-mix(in srgb,var(--surface-2) 55%,var(--surface)) 50%,var(--surface-2) 70%);background-size:220% 100%;animation:skel 1.2s linear infinite;border-radius:14px}
.shimmer{background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 50%,transparent 70%);background-size:200% 100%;animation:shimmer 2.4s linear infinite}
/* subs */
.tier{flex:1;min-width:84px;border:1px solid var(--rule);border-radius:12px;padding:10px;text-align:center;background:var(--surface);transition:transform .25s,border-color .25s,background .25s}
.tier.on{border-color:var(--accent);background:var(--accent-soft);transform:translateY(-3px)}
.stepper{display:flex;align-items:center;gap:0}
.st{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--muted);white-space:nowrap}
.st .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--rule-2);font-size:12px;transition:all .3s;background:var(--surface)}
.st.on{color:var(--ink)}.st.on .n{border-color:var(--accent);background:var(--accent);color:var(--btn-ink)}
.st.done .n{background:var(--success);border-color:var(--success);color:#fff}
.stline{flex:1;height:2px;background:var(--rule);margin:0 12px;min-width:24px;position:relative;overflow:hidden;border-radius:2px}
.stline i{position:absolute;inset:0;background:var(--accent);transform-origin:left;transition:transform .6s cubic-bezier(.2,.8,.2,1)}
.meter{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--s1),var(--accent));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--rule);border-top-color:var(--accent);animation:spin .8s linear infinite}
.check-big{width:84px;height:84px;border-radius:50%;background:var(--success-soft);display:grid;place-items:center;color:var(--success);animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.check-big path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw30 .6s ease .35s forwards}
.conf{position:absolute;left:50%;top:84px;width:9px;height:14px;border-radius:2px;animation:conf 1.4s cubic-bezier(.2,.7,.3,1) both;pointer-events:none}
.swap{animation:swap .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes growX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes draw30{to{stroke-dashoffset:0}}
@keyframes ping{0%{transform:scale(.6);opacity:.7}100%{transform:scale(1.6);opacity:0}}
@keyframes pop{from{transform:translate(var(--tx,0),var(--ty,0)) scale(0)}to{transform:translate(var(--tx,0),var(--ty,0)) scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.92) translateY(-6px)}to{opacity:1;transform:none}}
@keyframes palIn{from{opacity:0;transform:translateX(-50%) translateY(-12px) scale(.97)}to{opacity:1;transform:translateX(-50%)}}
@keyframes slideIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
@keyframes skel{from{background-position:200% 0}to{background-position:-20% 0}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes swap{from{opacity:0;transform:translateY(8px) scale(.99)}to{opacity:1;transform:none}}
@keyframes conf{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--cx),var(--cy)) rotate(var(--cr));opacity:0}}
@media (prefers-reduced-motion:reduce){.app *,.app *::before,.app *::after{animation:none!important;transition:none!important}.line{stroke-dashoffset:0}.area{opacity:1}}
.pt{--tx:-50%;--ty:-50%}
.stat{padding:16px;text-align:left;width:100%;display:block;cursor:pointer}
.stat.on{border-color:var(--accent);background:var(--accent-soft)}
.cb{width:20px;height:20px;border-radius:6px;border:2px solid var(--rule-2);display:grid;place-items:center;color:transparent;transition:all .15s;flex:none;background:var(--surface)!important}
.cb.on{background:var(--accent)!important;border-color:var(--accent);color:var(--btn-ink)}
.stp{display:flex;align-items:center;gap:10px;padding:5px 8px;margin:0 -8px;border-radius:8px;width:100%;transition:background .2s}
.stp:hover{background:var(--surface-2)}
.bulk{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--ink);color:var(--surface);border-radius:14px;padding:10px 14px;animation:fadeUp .3s cubic-bezier(.2,.8,.2,1) both}
.bulk .btn.ghost{background:transparent!important;color:var(--surface)!important;border-color:rgba(255,255,255,.3)!important}
.lock-preview{filter:blur(4px);opacity:.8;pointer-events:none;user-select:none;transition:filter .6s,opacity .6s}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;padding:6px 18px 18px 52px;animation:swap .3s ease both}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);border-left:1px solid var(--rule);box-shadow:var(--pop);z-index:81;padding:26px;display:flex;flex-direction:column;gap:20px;animation:slideIn .35s cubic-bezier(.2,.8,.2,1) both;overflow-y:auto}
.ev{display:flex;align-items:center;gap:12px;padding:11px 18px;border-top:1px solid var(--rule);animation:evIn .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes evIn{from{opacity:0;transform:translateY(-12px);background:var(--accent-soft)}to{opacity:1;transform:none}}
.app{color-scheme:light}.app.dark{color-scheme:dark}
html:has(.app.dark){color-scheme:dark}

.side-nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;display:flex;flex-direction:column;gap:6px;scrollbar-width:thin}
.side-foot{flex:none;display:flex;flex-direction:column;gap:6px;padding-top:8px}
@media (min-width:840px){.side{position:sticky;top:0;height:100vh;align-self:flex-start;overflow:hidden}}
.pro{font-size:10px;font-weight:700;letter-spacing:.06em;background:var(--amber);color:#1a1200;border-radius:6px;padding:1px 6px;margin-left:2px}
.seg button.locked{color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.pwrap{position:relative}.pwrap input{padding-right:46px}
.pwrap button{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.pwrap button:hover{background:var(--surface-2)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hintline{font-weight:400;font-size:12px;color:var(--muted)}
.req{color:var(--alarm)}
</style>
</head>
<body>
<div id="root"></div>
<script>window.__DC__ = { template: "<div class=\"app {{themeCls}}\" style=\"position:relative\">\n<div class=\"shell\">\n\n  <!-- SIDEBAR -->\n  <aside class=\"side {{sideCls}}\" style=\"flex:0 0 {{sbW}}px\">\n    <div class=\"brand\">\n      <span class=\"logo\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"3\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"14\" width=\"7\" height=\"7\" rx=\"1.5\"><\/rect><\/svg><\/span>\n      <span class=\"brand-name\" style=\"font-weight:700;flex:1;min-width:0;white-space:nowrap\">STM journals<\/span>\n      <button class=\"iconbtn\" style=\"width:32px;height:32px\" onClick=\"{{toggleSide}}\" aria-label=\"Collapse or expand the menu\">\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\" style=\"{{chevStyle}}\"><path d=\"M15 18l-6-6 6-6\"><\/path><\/svg>\n      <\/button>\n    <\/div>\n    <div class=\"side-nav\"><div class=\"menu-h\">MENU<\/div>\n    <button class=\"{{nav.overview}}\" title=\"Dashboard overview\" onClick=\"{{goOverview}}\" aria-current=\"{{cur.overview}}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"3\" y=\"3\" width=\"7\" height=\"9\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"3\" width=\"7\" height=\"5\" rx=\"1.5\"><\/rect><rect x=\"14\" y=\"12\" width=\"7\" height=\"9\" rx=\"1.5\"><\/rect><rect x=\"3\" y=\"16\" width=\"7\" height=\"5\" rx=\"1.5\"><\/rect><\/svg><span class=\"lbl\">Dashboard overview<\/span><\/button>\n    <button class=\"{{nav.users}}\" title=\"User management\" onClick=\"{{goUsers}}\" aria-current=\"{{cur.users}}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\/circle><path d=\"M2.5 20c.6-3.4 3.3-5.5 6.5-5.5s5.9 2.1 6.5 5.5\"><\/path><path d=\"M16 4.6a3.5 3.5 0 010 6.8M18 14.8c2 .6 3.2 2.3 3.5 5.2\"><\/path><\/svg><span class=\"lbl\">User management<\/span><sc-if value=\"{{hasBadge}}\" hint-placeholder-val=\"{{ true }}\"><span class=\"nav-badge\" aria-label=\"members waiting\">{{pendingBadge}}<\/span><\/sc-if><\/button>\n    <button class=\"{{nav.analytics}}\" title=\"Learning analytics\" onClick=\"{{goAnalytics}}\" aria-current=\"{{cur.analytics}}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 12h4l3 8 4-16 3 8h4\"><\/path><\/svg><span class=\"lbl\">Learning analytics<\/span><\/button>\n    <button class=\"{{nav.library}}\" title=\"Content library\" onClick=\"{{goLibrary}}\" aria-current=\"{{cur.library}}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z\"><\/path><path d=\"M12 6v13.5\"><\/path><\/svg><span class=\"lbl\">Content library<\/span><\/button>\n    <button class=\"{{nav.subs}}\" title=\"Subscriptions\" onClick=\"{{goSubs}}\" aria-current=\"{{cur.subs}}\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"2.5\" y=\"5\" width=\"19\" height=\"14\" rx=\"2.5\"><\/rect><path d=\"M2.5 10h19\"><\/path><\/svg><span class=\"lbl\">Subscriptions<\/span><\/button>\n    <\/div>\n\n    <div class=\"side-foot\">\n    <div class=\"side-card\">\n      <small>INSTITUTIONAL ACCESS<\/small>\n      <sc-if value=\"{{free}}\" hint-placeholder-val=\"{{ true }}\"><b style=\"font-size:15px;line-height:1.3\">Free preview<\/b><span style=\"font-size:12.5px;opacity:.85;line-height:1.45\">Premium removes the session clock for you and everyone you add.<\/span><button onClick=\"{{goSubs}}\">Explore Premium<\/button><\/sc-if>\n      <sc-if value=\"{{premium}}\" hint-placeholder-val=\"{{ false }}\"><b style=\"font-size:15px;line-height:1.3\">Premium is active<\/b><span style=\"font-size:12.5px;opacity:.85;line-height:1.45\">Unlimited reading until {{renewal}}.<\/span><button onClick=\"{{goSubs}}\">View subscription<\/button><\/sc-if>\n    <\/div>\n    <button class=\"signout\" onClick=\"{{noop}}\" title=\"Sign out\"><svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9\"><\/path><\/svg><span class=\"lbl\">Sign out<\/span><\/button>\n    <\/div>\n  <\/aside>\n\n  <!-- MAIN -->\n  <main style=\"flex:999 1 560px;min-width:0;display:flex;flex-direction:column\">\n    <header class=\"top\">\n      <h1 class=\"h2\" style=\"font-size:18px;margin-right:6px\">{{pageTitle}}<\/h1>\n      <button class=\"search\" onClick=\"{{openPalette}}\" aria-label=\"Search the library, members and pages\">\n        <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-3.5-3.5\"><\/path><\/svg>\n        <span style=\"flex:1;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis\">Search library, members, pages…<\/span><span class=\"kbd\">Ctrl K<\/span>\n      <\/button>\n      <span style=\"flex:1\"><\/span>\n      <div style=\"position:relative\">\n        <button class=\"pill sample\" onClick=\"{{toggleMenu}}\" aria-haspopup=\"menu\" aria-expanded=\"{{menu}}\">Prototype · sample activity <svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg><\/button>\n        <sc-if value=\"{{menu}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"pop\" style=\"width:270px\" role=\"menu\">\n            <div style=\"padding:12px 14px\"><b>Prototype controls<\/b><div class=\"sub\" style=\"font-size:12px\">Charts and members are sample data so the motion can be shown.<\/div><\/div>\n            <button class=\"pi\" role=\"menuitem\" onClick=\"{{protoPremium}}\"><b style=\"font-weight:600\">{{protoPremiumLabel}}<\/b><\/button>\n            <button class=\"pi\" role=\"menuitem\" onClick=\"{{protoReplay}}\"><b style=\"font-weight:600\">Replay the animations<\/b><\/button>\n            <button class=\"pi\" role=\"menuitem\" onClick=\"{{protoReset}}\"><b style=\"font-weight:600\">Reset everything<\/b><\/button>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n      <sc-if value=\"{{free}}\" hint-placeholder-val=\"{{ true }}\"><span class=\"pill amber\" title=\"The free-preview reading clock\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\/circle><path d=\"M12 7v5l3 2\"><\/path><\/svg>Next session in {{clock}}<\/span><\/sc-if>\n      <sc-if value=\"{{premium}}\" hint-placeholder-val=\"{{ false }}\"><span class=\"pill green\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg>Unlimited reading<\/span><\/sc-if>\n      <div style=\"position:relative\">\n        <button class=\"iconbtn\" onClick=\"{{toggleNotif}}\" aria-label=\"Notifications\" aria-haspopup=\"menu\" aria-expanded=\"{{notif}}\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 8a6 6 0 0112 0c0 7 3 8 3 8H3s3-1 3-8M10.3 21a1.9 1.9 0 003.4 0\"><\/path><\/svg>\n          <sc-if value=\"{{unread}}\" hint-placeholder-val=\"{{ true }}\"><span class=\"bell-dot\"><\/span><\/sc-if>\n        <\/button>\n        <sc-if value=\"{{notif}}\" hint-placeholder-val=\"{{ false }}\">\n          <div class=\"pop\" role=\"menu\">\n            <div style=\"display:flex;justify-content:space-between;align-items:center;padding:12px 14px\"><b>Notifications<\/b><button class=\"link\" style=\"font-size:12px\" onClick=\"{{markRead}}\">Mark all read<\/button><\/div>\n            <sc-for list=\"{{notifs}}\" as=\"n\" key=\"{{n.id}}\" hint-placeholder-count=\"3\"><div class=\"pi\"><span class=\"dot\" style=\"margin-top:7px;background:var(--accent)\"><\/span><span><span style=\"{{n.tone}}\">{{n.title}}<\/span><span class=\"sub\" style=\"display:block;font-size:12px\">{{n.when}}<\/span><\/span><\/div><\/sc-for>\n          <\/div>\n        <\/sc-if>\n      <\/div>\n      <button class=\"iconbtn\" onClick=\"{{toggleTheme}}\" aria-label=\"Switch between light and dark mode\">\n        <sc-if value=\"{{isDark}}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\/circle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\/path><\/svg><\/sc-if>\n        <sc-if value=\"{{isLight}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z\"><\/path><\/svg><\/sc-if>\n      <\/button>\n      <span class=\"avatar\" aria-label=\"Signed in as the librarian\">DI<\/span>\n    <\/header>\n    <sc-if value=\"{{popsOpen}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position:fixed;inset:0;z-index:20\" onClick=\"{{closePops}}\"><\/div><\/sc-if>\n\n    <div class=\"content\" key=\"{{epochKey}}\">\n\n    <!-- ============ LOADING SKELETON ============ -->\n    <sc-if value=\"{{isLoading}}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex;flex-direction:column;gap:22px\" aria-busy=\"true\" aria-label=\"Loading\">\n        <div class=\"skel\" style=\"height:190px\"><\/div>\n        <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\"><div class=\"skel\" style=\"height:130px\"><\/div><div class=\"skel\" style=\"height:130px\"><\/div><div class=\"skel\" style=\"height:130px\"><\/div><div class=\"skel\" style=\"height:130px\"><\/div><\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:16px\"><div class=\"skel\" style=\"flex:2 1 460px;height:300px\"><\/div><div class=\"skel\" style=\"flex:1 1 240px;height:300px\"><\/div><\/div>\n      <\/div>\n    <\/sc-if>\n\n    <!-- ================= OVERVIEW ================= -->\n    <sc-if value=\"{{isOverview}}\" hint-placeholder-val=\"{{ true }}\">\n      <section class=\"card rise\" style=\"padding:26px 28px;display:flex;flex-wrap:wrap;gap:28px;align-items:center;justify-content:space-between\">\n        <div style=\"flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:10px\">\n          <span class=\"eyebrow\">{{greeting}} · Librarian dashboard<\/span>\n          <h2 class=\"h1\">STM journals<\/h2>\n          <span class=\"sub\">Librarian · Digital Marketing · {{premiumLabel}}<\/span>\n          <p style=\"margin:6px 0 0;font-size:16px\">Your people can read <b style=\"font-variant-numeric:tabular-nums\">{{kItems}}<\/b> items across <b>{{kDepts}}<\/b> departments.<\/p>\n          <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:10px\">\n            <button class=\"btn primary\" onClick=\"{{openDrawer}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M12 5v14M5 12h14\"><\/path><\/svg>Add users<\/button>\n            <button class=\"btn ghost\" onClick=\"{{goLibrary}}\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M2 5.5C4.5 4 8 4 12 6c4-2 7.5-2 10-.5V19c-2.5-1.5-6-1.5-10 .5-4-2-7.5-2-10-.5z\"><\/path><\/svg>Browse the library<\/button>\n          <\/div>\n        <\/div>\n        <div style=\"flex:1 1 320px;max-width:440px;display:flex;gap:20px;align-items:center\">\n          <div style=\"position:relative;width:112px;height:112px;flex:none\">\n            <svg width=\"112\" height=\"112\" viewBox=\"0 0 112 112\" style=\"transform:rotate(-90deg)\" aria-hidden=\"true\"><circle cx=\"56\" cy=\"56\" r=\"48\" fill=\"none\" stroke=\"var(--surface-2)\" stroke-width=\"10\"><\/circle><circle cx=\"56\" cy=\"56\" r=\"48\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"10\" stroke-linecap=\"round\" stroke-dasharray=\"301.6\" stroke-dashoffset=\"{{heroOff}}\"><\/circle><\/svg>\n            <div style=\"position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1\"><div><b style=\"font-size:22px\">{{stepCount}}<\/b><div class=\"sub\" style=\"font-size:11px\">set up<\/div><\/div><\/div>\n          <\/div>\n          <ul style=\"list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:13px;flex:1;min-width:0\">\n            <sc-for list=\"{{steps}}\" as=\"s\" hint-placeholder-count=\"4\">\n              <li><button class=\"{{s.cls}}\" onClick=\"{{s.go}}\"><span style=\"{{s.boxStyle}}\"><sc-if value=\"{{s.done}}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg><\/sc-if><\/span><span style=\"{{s.textStyle}}\">{{s.label}}<\/span><\/button><\/li>\n            <\/sc-for>\n          <\/ul>\n        <\/div>\n      <\/section>\n\n      <sc-if value=\"{{bannerWarn}}\" hint-placeholder-val=\"{{ true }}\">\n        <section class=\"rise\" style=\"animation-delay:80ms;display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--caution-soft);border:1px solid color-mix(in srgb,var(--caution) 30%,transparent);border-radius:16px;padding:14px 18px\">\n          <span class=\"dot\"><\/span>\n          <span style=\"flex:1 1 280px\">{{pendingText}}<\/span>\n          <button class=\"btn primary sm\" onClick=\"{{sendReminders}}\">Send reminder<\/button>\n          <button class=\"btn ghost sm\" onClick=\"{{goUsers}}\">See who<\/button>\n          <button class=\"iconbtn\" style=\"width:34px;height:34px\" onClick=\"{{dismissBanner}}\" aria-label=\"Dismiss this notice\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n        <\/section>\n      <\/sc-if>\n      <sc-if value=\"{{bannerSent}}\" hint-placeholder-val=\"{{ false }}\">\n        <section class=\"rise\" style=\"display:flex;flex-wrap:wrap;align-items:center;gap:14px;background:var(--success-soft);border:1px solid color-mix(in srgb,var(--success) 30%,transparent);border-radius:16px;padding:14px 18px;color:var(--success)\">\n          <span class=\"check-big\" style=\"width:30px;height:30px\"><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg><\/span>\n          <span style=\"flex:1 1 280px;color:var(--ink)\">{{sentText}}<\/span>\n          <button class=\"iconbtn\" style=\"width:34px;height:34px\" onClick=\"{{dismissBanner}}\" aria-label=\"Dismiss this notice\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"><\/path><\/svg><\/button>\n        <\/section>\n      <\/sc-if>\n\n      <section style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px\">\n        <article class=\"card lift rise\" style=\"animation-delay:120ms;padding:18px;display:flex;flex-direction:column;gap:10px\">\n          <span class=\"eyebrow\">Plan<\/span>\n          <sc-if value=\"{{free}}\" hint-placeholder-val=\"{{ true }}\">\n            <span class=\"pill teal\" style=\"align-self:flex-start\"><span class=\"dot\" style=\"background:var(--accent)\"><\/span>Free preview<\/span>\n            <div style=\"display:flex;gap:6px\" role=\"img\" aria-label=\"1 of 4 sessions used today\"><sc-for list=\"{{pips}}\" as=\"pip\" hint-placeholder-count=\"4\"><span style=\"{{pip.style}}\"><\/span><\/sc-for><\/div>\n            <span class=\"sub\">Half-hour sessions, 1 of 4 used today<\/span>\n          <\/sc-if>\n          <sc-if value=\"{{premium}}\" hint-placeholder-val=\"{{ false }}\">\n            <span class=\"pill green\" style=\"align-self:flex-start\">Premium<\/span>\n            <b style=\"font-size:22px;letter-spacing:-.02em\">No session limit<\/b>\n            <span class=\"sub\">Active until {{renewal}}<\/span>\n          <\/sc-if>\n        <\/article>\n        <article class=\"card lift rise\" style=\"animation-delay:180ms;padding:18px;display:flex;flex-direction:column;gap:6px\">\n          <span class=\"eyebrow\">Departments<\/span>\n          <b style=\"font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums\">{{kDepts}}<\/b>\n          <span class=\"sub\">Included in your access<\/span>\n          <button class=\"link\" style=\"margin-top:auto;font-size:13px\" onClick=\"{{goLibrary}}\">View departments →<\/button>\n        <\/article>\n        <article class=\"card lift rise\" style=\"animation-delay:240ms;padding:18px;display:flex;flex-direction:column;gap:6px\">\n          <span class=\"eyebrow\">Members<\/span>\n          <b style=\"font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums\">{{kMembers}}<\/b>\n          <span class=\"sub\">{{kRead}} reading · {{pendingBadge}} yet to start<\/span>\n          <button class=\"link\" style=\"margin-top:auto;font-size:13px\" onClick=\"{{goUsers}}\">Manage users →<\/button>\n        <\/article>\n        <article class=\"card lift rise\" style=\"animation-delay:300ms;padding:18px;display:flex;flex-direction:column;gap:6px\">\n          <span class=\"eyebrow\">Items you can read<\/span>\n          <b style=\"font-size:34px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums\">{{kItems}}<\/b>\n          <svg viewBox=\"0 0 120 30\" width=\"100%\" height=\"30\" preserveAspectRatio=\"none\" aria-hidden=\"true\"><path class=\"line\" pathLength=\"1\" d=\"M0 24 C12 22 18 25 28 20 S46 14 58 16 S78 9 90 11 S108 5 120 3\" fill=\"none\" stroke=\"var(--s1)\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\/path><\/svg>\n          <span class=\"sub\">5 added lately<\/span>\n        <\/article>\n      <\/section>\n\n      <section style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n        <article class=\"card rise\" style=\"animation-delay:160m             <span style=\"font-size:13px;opacity:.85;margin-top:auto\">Active until {{renewal}}<\/span>\n          <\/article>\n        <\/sc-if>\n      <\/section>\n\n      <section style=\"display:flex;flex-wrap:wrap;gap:16px;align-items:stretch\">\n        <article class=\"card rise\" style=\"animation-delay:200ms;flex:1.5 1 480px;min-width:0;padding:20px;display:flex;flex-direction:column;gap:14px\">\n          <div style=\"display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:flex-start\">\n            <div><h3 class=\"h2\">Where the collection is deep<\/h3><span class=\"sub\">Tap a legend item to hide it. Click a department to open it.<\/span><\/div>\n            <div style=\"display:flex;flex-wrap:wrap;gap:2px\"><sc-for list=\"{{legends}}\" as=\"l\" hint-placeholder-count=\"3\"><button class=\"{{l.cls}}\" aria-pressed=\"{{l.on}}\" onClick=\"{{l.toggle}}\"><i style=\"{{l.style}}\"><\/i>{{l.nm}}<\/button><\/sc-for><\/div>\n          <\/div>\n          <div style=\"display:flex;flex-direction:column;gap:14px\">\n            <sc-for list=\"{{deep}}\" as=\"d\" key=\"{{d.name}}\" hint-placeholder-count=\"4\">\n              <div>\n                <button style=\"display:flex;justify-content:space-between;width:100%;font-size:13px;margin-bottom:6px\" onClick=\"{{d.open}}\"><span style=\"font-weight:500\">{{d.name}}<\/span><span style=\"font-variant-numeric:tabular-nums;color:var(--ink-2)\">{{d.total}}<\/span><\/button>\n                <div class=\"track\"><div class=\"seg-bar\" style=\"{{d.a.style}}\" onMouseEnter=\"{{d.a.enter}}\" onMouseLeave=\"{{d.a.leave}}\"><\/div><div class=\"seg-bar\" style=\"{{d.b.style}}\" onMouseEnter=\"{{d.b.enter}}\" onMouseLeave=\"{{d.b.leave}}\"><\/div><div class=\"seg-bar\" style=\"{{d.c.style}}\" onMouseEnter=\"{{d.c.enter}}\" onMouseLeave=\"{{d.c.leave}}\"><\/div><\/div>\n              <\/div>\n            <\/sc-for>\n          <\/div>\n          <div class=\"sub\" style=\"min-height:20px;border-top:1px sol :var(--muted)\">{{s.pct}}%<\/span><\/div>\n            <\/sc-for>\n          <\/div>\n          <button class=\"link\" style=\"margin-top:auto;font-size:13px\" onClick=\"{{goAnalytics}}\">Open learning analytics →<\/button>\n        <\/article>\n        <article class=\"card rise\" style=\"animation-delay:210ms;flex:1.5 1 440px;min-width:0;overflow:hidden\">\n          <div style=\"padding:18px 18px 10px;display:flex;flex-direction:column;gap:10px\"><span class=\"eyebrow\">Newest on your shelves<\/span>\n            <div style=\"display:flex;flex-wrap:wrap;gap:6px\"><sc-for list=\"{{shelfTabs}}\" as=\"t\" hint-placeholder-count=\"5\"><button class=\"{{t.cls}}\" style=\"min-height:30px;font-size:12px\" aria-pressed=\"{{t.pressed}}\" onClick=\"{{t.pick}}\">{{t.t}}<\/button><\/sc-for><\/div>\n          <\/div>\n          <sc-for list=\"{{shelves}}\" as=\"t\" key=\"{{t.key}}\" hint-placeholder-count=\"3\"><button class=\"row rise\" style=\"{{t.delay}}\" onClick=\"{{t.open}}\"><span style=\"flex:1;min-width:0\"><b style=\"display:block;font-weight:600\">{{t.title}}<\/b><span class=\"sub\">{{t.meta}}<\/span><\/span><svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--faint)\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M9 6l6 6-6 6\"><\/path><\/svg><\/button><\/sc-for>\n        <\/article>\n      <\/section>\n    <\/sc-if>\n\n\n    <!-- ================= USERS ================= -->\n    <sc-if value=\"{{isUsers}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"rise\" style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end\">\n        <div><span class=\"eyebrow\">Your people<\/span><h2 class=\"h1\" style=\"font-size:30px;margin-top:4px\">User management<\/h2><span class=\"sub\">Add members, see who is reading and nudge the ones who have not started.<\/span><\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px\"><button class=\"btn ghost\" onClic ckground:none;color:var(--ink);font:inherit;outline:none\" value=\"{{mq}}\" onInput=\"{{setMq}}\" placeholder=\"Search name, email or title…\" aria-label=\"Search members\"><\/label>\n          <div class=\"seg\" role=\"group\" aria-label=\"Sort by\"><sc-for list=\"{{sorts}}\" as=\"so\" hint-placeholder-count=\"2\"><button class=\"{{so.cls}}\" aria-pressed=\"{{so.on}}\" onClick=\"{{so.pick}}\">{{so.l}}<\/button><\/sc-for><\/div>\n          <span style=\"flex:1\"><\/span><span class=\"sub\">Showing {{shownCount}}<\/span>\n        <\/div>\n        <div style=\"display:flex;align-items:center;gap:12px;padding:8px 18px;border-top:1px solid var(--rule);background:var(--surface-2)\">\n          <button class=\"{{allCls}}\" role=\"checkbox\" aria-checked=\"{{allOn}}\" aria-label=\"Select everyone shown\" onClick=\"{{toggleAll}}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg><\/button>\n          <span class=\"eyebrow\" style=\"flex:1\">Member<\/span><span class=\"eyebrow\" style=\"width:110px\">Type<\/span><span class=\"eyebrow\" style=\"width:120px\">Status<\/span><span style=\"width:34px\"><\/span>\n        <\/div>\n        <sc-for list=\"{{members}}\" as=\"m\" key=\"{{m.key}}\" hint-placeholder-count=\"3\">\n          <div class=\"rise\" style=\"{{m.rowStyle}}\">\n            <div class=\"row\" style=\"flex-wrap:wrap\">\n              <button class=\"{{m.cbCls}}\" role=\"checkbox\" aria-checked=\"{{m.sel}}\" aria-label=\"Select this member\" onClick=\"{{m.toggle}}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12.5l4.5 4.5L19 7\"><\/path><\/svg><\/button>\n              <span class=\"avatar\">{{m.ini}}<\/span>\n              <span style=\"flex:1 1 200px;min-width:0\"><b style=\"display:block\">{{m.name}}<\/b><span class=\"sub\">{{m.email}}<\/span><\/span>\n              <span style=\"width:110px\"><span class=\"tag fac\">{{m.type}}<\/span><\/span>\n              <span style=\"width:120px\"><span class=\"{{m.statusCls}}\">{{m.status}}<\/span><\/span>\n              <button class=\"iconbtn\" style=\"width:34px;height:34px\" aria-expanded=\"{{m.open}}\" aria-label=\"Show details\" onClick=\"{{m.expand}}\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" aria-hidden=\"true\" style=\"{{m.chev}}\"><path d=\"M6 9l6 6 6-6\"><\/path><\/svg><\/button>\n            <\/div>\n            <sc-if value=\"{{m.open}}\" hint-placeholder-val=\"{{ false }}\">\n              <div class=\"detail\">\n                <div><span class=\"eyebrow\">Designation<\/span><div style=\"font-weight:600\">{{m.desig}}<\/div><span class=\"sub\">{{m.last}}<\/span><\/div>\n                <sc-if value=\"{{m.hasContact}}\" hint-placeholder-val=\"{{ false }}\"><div><span class=\"eyebrow\">Contact<\/span><div style=\"font-weight:600\">{{m.contactLine}}<\/div><\/div><\/sc-if>\n                <div><span class=\"eyebrow\">Sessions this month<\/span><div style=\"font-size:22px;font-weight:700\">{{m.sessions}}<\/div><\/div>\n                <div><span class=\"eyebrow\">Recently opened<\/span><ul style=\"margin:4px 0 0;padding-left:16px;font-size:13px;color:var(--ink-2)\"><sc-for list=\"{{m.itemList}}\" as=\"it\" hint-placeholder-count=\"2\"><li>{{it}}<\/li><\/sc-for><\/ul><\/div>\n                <div style=\"display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start\">\n                  <sc-if value=\"{{m.canRemind}}\" hint-placeholder-val=\"{{ true }}\"><button class=\"btn ghost sm\" disabled=\"{{m.remindOff}}\" onClick=\"{{m.remind}}\">{{m.remindLabel}}<\/button><\/sc-if>\n                  <button class=\"btn danger sm\" onClick=\"{{m.remove}}\">Remove<\/button>\n                <\/div>\n              <\/div>\n            <\/sc-if>\n          <\/div>\n        <\/sc-for>\n        <sc-if value=\"{{noMembers}}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding:40px 20px;text-align:center;border-top:1px solid var(--rule)\"><b>No member matches<\/b><div class=\"sub\" style=\"margin:4px 0 12px\">Try a different search or filter.<\/div><button class=\"btn ghost sm\" onClick=\"{{clearFilters}}\">Clear filters<\/button><\/div><\/sc-if>\n      <\/section>\n    <\/sc-if>\n\n    <!-- ================= LIBRARY ================= -->\n    <sc-if value=\"{{isLibrary}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"rise\" style=\"display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end\">\n        <div><span class=\"eyebrow\">What you hold<\/span><h2 class=\"h1\" style=\"font-size:30px;margin-top:4px\">Content library<\/h2><span class=\"sub\">{{libCount}}. Open a department to see what is inside.<\/span><\/div>\n        <div style=\"display:flex;flex-wrap:wrap;gap:10px;align-items:center\">\n          <label class=\"search\" style=\"max-width:300px;cursor:text\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" aria-hidden=\"true\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\/circle><path d=\"M20 20l-3.5-3.5\"><\/path><\/svg><input type=\"search\" style=\"flex:1;min-width:0;border:0;background:none;color:var(--ink);font:inherit;outline:none\" value=\"{{lq}}\" onInput=\"{{setLq}}\" placeholder=\"Search departments…\" aria-label=\"Search departments\"><\/label>\n          <div class=\"seg\" role=\"group\" aria-label=\"Sort\"><sc-for list=\"{{lsorts}}\" as=\"so\" hint-placeholder-count=\"2\"><button class=\"{{so.cls}}\" aria-pressed=\"{{so.on}}\" onClick=\"{{so.pick}}\">{{so.l}}<\/button><\/sc-for><\/div>\n          <div class=\"seg\" role=\"group\" aria-label=\"Layout\"><sc-for list=\"{{views}} ox-shadow:var(--pop)\">\n              <span class=\"logo\" style=\"width:46px;height:46px;border-radius:14px\"><svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><rect x=\"4\" y=\"11\" width=\"16\" height=\"10\" rx=\"2\"><\/rect><path d=\"M8 11V8a4 4 0 118 0v3\"><\/path><\/svg><\/span>\n              <h3 style=\"margin:0;font-size:22px;letter-spacing:-.02em\">Unlock institutional analytics<\/h3>\n              <p class=\"sub\" style=\"margin:0;font-size:14px;line-height:1.6\">Analytics opens with a Premium department subscription, for everyone you add. The summary on your dashboard stays open either way.<\/p>\n              <div style=\"display:flex;gap:8px;flex-wrap:wrap;justify-content:center\"><span class=\"pill teal\">Active readers<\/span><span class=\"pill teal\">User-wise usage<\/span><span class=\"pill teal\">Reading timeline<\/span><span class=\"pill teal\">Reports<\/span><\/div>\n              <div style=\"display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px\"><button class=\"btn primary\" onClick=\"{{goSubs}}\">Subscribe from ₹7,990*<\/button><button class=\"btn ghost\" onClick=\"{{togglePeek}}\">Peek with sample data<\/button><\/div>\n              <span class=\"sub\" style=\"font-size:12px\">*per department per year, when 5 or more are chosen. 18% GST extra.<\/span>\n            <\/div>\n          <\/div>\n        <\/sc-if>\n      <\/section>\n    <\/sc-if>\n\n    <!-- ================= SUBSCRIPTIONS ================= -->\n    <sc-if value=\"{{isSubs}}\" hint-placeholder-val=\"{{ false }}\">\n      <section class=\"rise\" style=\"background:var(--navy);color:#fff;border-radius:18px;padding:26px 28px;display:flex;flex-wrap:wrap;gap:20px;align-items:center;justify-content:space-between;position:relative;overflow:hidden\">\n        <div class=\"shimmer\" style=\"position:absolute;inset:0;opacity:.18;poin
