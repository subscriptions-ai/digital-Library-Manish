<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STM Digital Library · Admin dashboard prototype v2</title>
<meta name="description" content="Design prototype of the STM Digital Library admin dashboard. Sample data only; not connected to any backend.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   STM Digital Library — librarian dashboard prototype v2
   One stylesheet: tokens → base → components → layout → pages → layers → motion → responsive
   ========================================================================== */

/* ---- 1. Design tokens ------------------------------------------------------ */
:root { --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --ease: cubic-bezier(.2, .8, .2, 1); }

.app {
  /* surfaces and text */
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f0f2f7; --line: #e2e6ee; --line-2: #cdd3df;
  --ink: #0f172b; --ink-2: #364055; --muted: #5a6479; --faint: #8b94a7;
  /* brand: navy structures, blue acts */
  --navy: #0f172b; --navy-2: #1a2540;
  --blue: #1b5dfc; --blue-hover: #1249d6; --blue-soft: #eaf0ff; --blue-line: #c7d8ff; --blue-ink: #0f3fbf; --on-blue: #ffffff;
  /* functional colours: teal for reading/analytics, green success, amber preview/waiting, red critical */
  --teal: #0e8f9b; --teal-soft: #e0f4f5; --teal-ink: #0a6a73;
  --green: #167a4f; --green-soft: #e2f5ec;
  --amber: #a15407; --amber-soft: #fef3dc; --amber-line: #f3d9a6; --gold: #f5b301;
  --red: #b42318; --red-soft: #fdecea;
  /* chart series */
  --s1: #0e8f9b; --s2: #c2650f; --s3: #6d4fd6;
  /* depth and rhythm */
  --shadow: 0 1px 2px rgba(15, 23, 43, .05); --pop: 0 12px 32px rgba(15, 23, 43, .14);
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --sw: 240px; --mw: 240px;
  color-scheme: light;
  font-family: var(--font); background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5;
  min-height: 100vh; transition: background .3s var(--ease), color .3s var(--ease);
}
.app.dark {
  --bg: #0a1020; --surface: #0f172b; --surface-2: #17213a; --line: #212d4a; --line-2: #2e3c5e;
  --ink: #e9edf6; --ink-2: #c3cbdb; --muted: #97a3ba; --faint: #66738c;
  --navy: #0b1224; --navy-2: #17213a;
  --blue: #4a7dff; --blue-hover: #6590ff; --blue-soft: #16264f; --blue-line: #2a4180; --blue-ink: #a7c0ff; --on-blue: #06122e;
  --teal: #35c2cf; --teal-soft: #0f3139; --teal-ink: #7fdce5;
  --green: #5fd196; --green-soft: #11301f;
  --amber: #f0b46a; --amber-soft: #38280f; --amber-line: #5b4219; --gold: #f5b301;
  --red: #f08a84; --red-soft: #3a1a19;
  --s1: #35c2cf; --s2: #e1923f; --s3: #a28cff;
  --shadow: none; --pop: 0 14px 36px rgba(0, 0, 0, .55);
  color-scheme: dark;
}

/* ---- 2. Base --------------------------------------------------------------- */
body { margin: 0; }
.app *, .app *::before, .app *::after { box-sizing: border-box; }
.app h1, .app h2, .app h3, .app p, .app ul, .app dl, .app dd { margin: 0; padding: 0; }
.app ul { list-style: none; }
:where(.app) button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:where(.app) input, :where(.app) select, :where(.app) textarea { font: inherit; color: inherit; }
.app :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.app button:disabled { cursor: not-allowed; opacity: .5; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 200; background: var(--navy); color: #fff; padding: 10px 16px; border-radius: 10px; font-weight: 600; transition: top .2s; }
.skip:focus { top: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* ---- 3. Components --------------------------------------------------------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); box-shadow: var(--shadow); transition: transform .2s var(--ease), border-color .2s, box-shadow .2s, background .3s; }
.card.pad { padding: 20px; }
.card.lift:hover { transform: translateY(-2px); border-color: var(--line-2); box-shadow: var(--pop); }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.h-page { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.02em; }
.h-sec { font-size: 18px; line-height: 1.3; font-weight: 650; letter-spacing: -.01em; }
.h-card { font-size: 15px; line-height: 1.35; font-weight: 650; }
.sub { font-size: 13px; color: var(--muted); }
.big { font-size: 32px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; padding: 0 16px; border-radius: 10px; font-weight: 600; font-size: 14px; white-space: nowrap; text-align: center; transition: transform .15s var(--ease), background .2s, border-color .2s, box-shadow .2s; }
.btn.primary { background: var(--blue); color: var(--on-blue); }
.btn.primary:hover:not(:disabled) { background: var(--blue-hover); }
.btn.secondary { background: var(--surface); color: var(--ink); border: 1px solid var(--line-2); }
.btn.secondary:hover:not(:disabled) { background: var(--surface-2); }
.btn.ghost { color: var(--blue); }
.btn.ghost:hover:not(:disabled) { background: var(--blue-soft); }
.btn.danger { background: var(--red-soft); color: var(--red); }
.btn.navy { background: var(--navy); color: #fff; }
.btn.sm { min-height: 36px; padding: 0 12px; font-size: 13px; border-radius: 9px; }
.btn.block { width: 100%; }
.btn:active:not(:disabled) { transform: scale(.98); }
.iconbtn { width: 40px; height: 40px; border-radius: 10px; display: inline-grid; place-items: center; color: var(--ink-2); border: 1px solid var(--line); background: var(--surface); position: relative; flex: none; transition: background .2s, transform .15s; }
.iconbtn:hover { background: var(--surface-2); }
.iconbtn.flat { border-color: transparent; background: transparent; }
.link { color: var(--blue); font-weight: 600; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; }
.link:hover { text-decoration: underline; }

.tag { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 1.4; }
.tag.ok { background: var(--green-soft); color: var(--green); }
.tag.warn { background: var(--amber-soft); color: var(--amber); }
.tag.info { background: var(--blue-soft); color: var(--blue-ink); }
.tag.teal { background: var(--teal-soft); color: var(--teal-ink); }
.tag.mute { background: var(--surface-2); color: var(--muted); }
.tag.sample { background: transparent; border: 1px dashed var(--line-2); color: var(--muted); font-weight: 500; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 600; white-space: nowrap; min-height: 32px; }
.pill.warn { background: var(--amber-soft); color: var(--amber); border: 1px solid var(--amber-line); }
.pill.ok { background: var(--green-soft); color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 30%, transparent); }

.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; }
.seg button { min-height: 34px; padding: 0 12px; border-radius: 8px; font-weight: 600; font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(15, 23, 43, .12); }
.seg button.locked { color: var(--muted); }
.premium-tag { font-size: 10px; font-weight: 700; letter-spacing: .04em; background: var(--gold); color: #1a1200; border-radius: 6px; padding: 1px 6px; }

.chip { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 500; transition: background .2s, border-color .2s, color .2s, transform .15s; }
.chip:hover { border-color: var(--blue); }
.chip.on { background: var(--blue-soft); border-color: var(--blue); color: var(--blue-ink); font-weight: 600; }
.chip.sm { min-height: 34px; padding: 0 12px; font-size: 12.5px; }
.chip .tick { width: 0; height: 14px; overflow: hidden; transition: width .2s; }
.chip.on .tick { width: 14px; }

.field { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 13px; min-width: 0; }
.field .lab { display: block; }
.inp, .sel select { width: 100%; height: 44px; border-radius: 10px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink); padding: 0 12px; font-weight: 400; }
textarea.inp { height: auto; min-height: 110px; padding: 10px 12px; line-height: 1.5; resize: vertical; }
.inp::placeholder { color: var(--faint); }
.inp:focus, .sel select:focus { outline: 2px solid var(--blue); outline-offset: 0; border-color: var(--blue); }
.sel { position: relative; display: block; min-width: 0; }
.sel select { appearance: none; padding-right: 34px; height: 40px; font-weight: 500; }
.sel::after { content: ""; position: absolute; right: 14px; top: 50%; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: translateY(-70%) rotate(45deg); pointer-events: none; }
.field.err .inp { border-color: var(--red); animation: shake .3s; }
.msg { color: var(--red); font-weight: 500; font-size: 12px; min-height: 0; }
.hint { font-weight: 400; font-size: 12px; color: var(--muted); }
.req { color: var(--red); }
.pw { position: relative; display: block; }
.pw .inp { padding-right: 46px; }
.pw button { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
.pw button:hover { background: var(--surface-2); }
.search { display: flex; align-items: center; gap: 10px; height: 42px; width: 100%; padding: 0 8px 0 14px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); transition: border-color .2s, background .2s; min-width: 0; }
.search:hover { border-color: var(--blue); background: var(--surface); }
.search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; height: 100%; color: var(--ink); }
.search span.t { flex: 1; min-width: 0; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kbd { font-size: 11px; font-weight: 600; border: 1px solid var(--line-2); border-radius: 6px; padding: 1px 7px; background: var(--surface); color: var(--muted); }

.banner { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 14px; border-radius: var(--r-md); padding: 12px 16px; border: 1px solid transparent; }
.banner .txt { flex: 1 1 260px; min-width: 0; }
.banner.warn { background: var(--amber-soft); border-color: var(--amber-line); }
.banner.ok { background: var(--green-soft); border-color: color-mix(in srgb, var(--green) 28%, transparent); }
.banner.info { background: var(--blue-soft); border-color: var(--blue-line); }
.banner .ic { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.banner.warn .ic { background: color-mix(in srgb, var(--amber) 16%, transparent); color: var(--amber); }
.banner.ok .ic { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
.banner.info .ic { background: color-mix(in srgb, var(--blue) 14%, transparent); color: var(--blue-ink); }
.track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; display: flex; }
.seg-bar { height: 100%; transform-origin: left; animation: growX .8s var(--ease) both; transition: width .45s var(--ease); }
.meter { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .5s var(--ease); }
.divider { height: 1px; background: var(--line); border: 0; margin: 0; }
.avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--blue-soft); color: var(--blue-ink); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
.logo { width: 36px; height: 36px; border-radius: 10px; background: var(--navy); color: #fff; display: grid; place-items: center; flex: none; font-weight: 700; font-size: 13px; letter-spacing: .02em; }
.app.dark .logo { background: var(--blue); color: var(--on-blue); }
.cb { width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--line-2); display: grid; place-items: center; color: transparent; background: var(--surface); transition: all .15s; flex: none; }
.cb.on { background: var(--blue); border-color: var(--blue); color: var(--on-blue); }
.empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 44px 20px; }
.empty .ic { width: 56px; height: 56px; border-radius: 16px; background: var(--blue-soft); color: var(--blue-ink); display: grid; place-items: center; margin-bottom: 6px; }
.skel { background: linear-gradient(100deg, var(--surface-2) 30%, color-mix(in srgb, var(--surface-2) 50%, var(--surface)) 50%, var(--surface-2) 70%); background-size: 220% 100%; animation: skel 1.3s linear infinite; border-radius: 14px; }

/* ---- 4. Shell: sidebar, top bar, page ------------------------------------- */
.side { position: fixed; z-index: 40; left: 0; top: 0; bottom: 0; width: var(--sw); background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 16px 12px 12px; transition: width .28s var(--ease), transform .28s var(--ease), background .3s; }
.side.rail { --sw: 72px; }
.side.mobile { --sw: 284px; transform: translateX(-104%); box-shadow: var(--pop); visibility: hidden; transition: width .28s var(--ease), transform .28s var(--ease), visibility 0s .28s, background .3s; }
.side.mobile.open { transform: none; visibility: visible; transition-delay: 0s; }
.side.rail.open { --sw: 264px; box-shadow: var(--pop); }
.side.open { z-index: 50; }
.side.desktop.collapsed { --sw: 72px; }
.side-head { display: flex; align-items: center; gap: 10px; padding: 2px 4px 14px; min-height: 52px; }
.side-head .name { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.side-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 2px; scrollbar-width: thin; }
.side-foot { flex: none; display: flex; flex-direction: column; gap: 4px; padding-top: 10px; }
.nav-label { font-size: 10.5px; font-weight: 600; letter-spacing: .12em; color: var(--muted); padding: 14px 12px 6px; white-space: nowrap; }
.nav-label:first-child { padding-top: 4px; }
.nav { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 42px; padding: 0 12px; border-radius: 10px; color: var(--ink-2); font-weight: 500; position: relative; white-space: nowrap; transition: background .2s, color .2s; }
.nav:hover { background: var(--surface-2); color: var(--ink); }
.nav.active { background: var(--blue-soft); color: var(--blue-ink); font-weight: 600; }
.nav.active::before { content: ""; position: absolute; left: -12px; top: 9px; bottom: 9px; width: 3px; border-radius: 0 3px 3px 0; background: var(--blue); }
.nav svg { flex: none; }
.nav .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.nav-badge { min-width: 20px; height: 20px; border-radius: 99px; background: var(--amber); color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; }
.app.dark .nav-badge { color: #1a1200; background: var(--gold); }
.access-card { background: var(--navy); color: #fff; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 6px; }
.app.dark .access-card { background: var(--navy-2); border: 1px solid var(--line); }
.access-card .eyebrow { color: rgba(255, 255, 255, .65); }
.access-card b { font-size: 15px; }
.access-card p { font-size: 12.5px; opacity: .8; line-height: 1.45; }
.access-card button { margin-top: 6px; min-height: 38px; border-radius: 9px; background: var(--blue); color: var(--on-blue); font-weight: 600; text-align: center; transition: background .2s; }
.access-card button:hover { background: var(--blue-hover); }
.side.narrow .lbl, .side.narrow .access-card, .side.narrow .nav-label, .side.narrow .side-head .name, .side.narrow .nav-badge { display: none; }
.side.narrow .nav, .side.narrow .signout { justify-content: center; padding: 0; }
.side.narrow .nav.active::before { left: -12px; }
.side.narrow .side-head { flex-direction: column; padding-bottom: 10px; }
.side.narrow .nav-sep { display: block; }
.nav-sep { display: none; height: 1px; background: var(--line); margin: 8px 6px; }
.side-scrim { position: fixed; inset: 0; z-index: 45; background: rgba(8, 14, 30, .5); animation: fadeIn .2s both; }
.tooltip { position: fixed; z-index: 70; left: 80px; transform: translateY(-50%); background: var(--navy); color: #fff; font-size: 12.5px; font-weight: 600; padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: nowrap; animation: fadeIn .12s both; box-shadow: var(--pop); }

.main { margin-left: var(--mw); min-width: 0; transition: margin-left .28s var(--ease); }
.top { position: sticky; top: 0; z-index: 30; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 12px 16px; padding: 12px 28px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line); min-height: 64px; }
.top .left { display: flex; align-items: center; gap: 10px; min-width: 0; }
.top .title { font-size: 17px; font-weight: 650; white-space: nowrap; }
.top .mid { display: flex; justify-content: center; min-width: 0; }
.top .mid .search { max-width: 520px; }
.top .right { display: flex; align-items: center; gap: 8px; }
.burger { display: none; }
.page { width: min(100% - 48px, 1320px); margin-inline: auto; padding: 28px 0 72px; display: flex; flex-direction: column; gap: 24px; }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.page-head .actions { display: flex; flex-wrap: wrap; gap: 10px; }
.grid-kpi { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 190px), 1fr)); gap: 16px; }
.grid-kpi.four { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.split { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 20px; align-items: stretch; }
.split.even { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.split.pick { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.kpi { padding: 18px 20px; display: flex; flex-direction: column; gap: 6px; min-height: 148px; }
.kpi .big { margin-top: 2px; }
.kpi .foot { margin-top: auto; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid var(--line); width: 100%; transition: background .2s; }
button.row:hover { background: var(--surface-2); }
.menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 40px; padding: 0 14px; font-weight: 500; border-top: 1px solid var(--line); }
.menu-item:hover { background: var(--surface-2); }

/* ---- 5. Charts ------------------------------------------------------------ */
.plot { position: relative; height: clamp(190px, 24vw, 260px); margin-left: 36px; }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--line); }
.gridlbl { position: absolute; left: -36px; width: 30px; text-align: right; font-size: 11px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.hit { position: absolute; top: 0; bottom: 0; cursor: crosshair; }
.hit:focus-visible { outline-offset: -2px; }
.cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line-2); pointer-events: none; }
.pt { position: absolute; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 3px solid var(--s1); transform: translate(-50%, -50%); pointer-events: none; box-shadow: 0 0 0 4px color-mix(in srgb, var(--s1) 20%, transparent); }
.tip { position: absolute; background: var(--navy); color: #fff; border-radius: 9px; padding: 6px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; pointer-events: none; transform: translate(-50%, -130%); z-index: 5; box-shadow: var(--pop); }
.app.dark .tip { background: var(--surface-2); border: 1px solid var(--line-2); }
.xlabels { display: flex; margin-left: 36px; }
.xlabels span { flex: 1; min-width: 0; text-align: center; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.area { opacity: 0; animation: fadeIn .7s ease .45s forwards; }
.line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.1s var(--ease) forwards; }
.donut { transition: opacity .2s; cursor: pointer; }
.donut.dim { opacity: .25; }
.legend { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 36px; padding: 0 8px; border-radius: 8px; font-size: 13px; transition: background .2s; }
.legend:hover { background: var(--surface-2); }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.heat { width: 100%; aspect-ratio: 1.5; min-height: 20px; border-radius: 5px; transition: transform .12s, outline-color .12s; outline: 2px solid transparent; cursor: pointer; }
.heat:hover { transform: scale(1.12); outline-color: var(--ink); }

/* ---- 7. Layers: drawers, palette, popovers, toast, prototype controls ------ */
.scrim { position: fixed; inset: 0; background: rgba(8, 14, 30, .5); z-index: 80; animation: fadeIn .2s both; }
.drawer { position: fixed; z-index: 81; top: 0; right: 0; bottom: 0; width: min(480px, 100%); background: var(--surface); border-left: 1px solid var(--line); box-shadow: var(--pop); display: flex; flex-direction: column; animation: slideIn .3s var(--ease) both; }

.drawer-foot { display: flex; gap: 10px; padding: 14px 24px; border-top: 1px solid var(--line); background: var(--surface); }

.palette input { width: 100%; height: 56px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--ink); font-size: 16px; padding: 0 20px; outline: none; }

.pop-scrim { position: fixed; inset: 0; z-index: 20; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); background: var(--navy); color: #fff; border-radius: 12px; padding: 10px 12px 10px 18px; font-weight: 600; z-index: 120; box-shadow: var(--pop); display: flex; gap: 14px; align-items: center; max-width: 92vw; animation: toastIn .3s var(--ease) both; }
.app.dark .toast { background: var(--surface-2); border: 1px solid var(--line-2); }
.toast button { color: #9db9ff; font-weight: 700; padding: 6px 10px; border-radius: 8px; min-height: 36px; }
.proto { position: fixed; z-index: 60; right: 14px; bottom: 14px; }
.proto > button { height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--muted); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; opacity: .75; transition: opacity .2s; }
.proto > button:hover, .proto > button[aria-expanded="true"] { opacity: 1; }
.proto .pop { top: auto; bottom: 44px; width: 290px; transform-origin: bottom right; }
.switch { width: 38px; height: 22px; border-radius: 99px; background: var(--line-2); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s var(--ease); }
.switch.on { background: var(--blue); } .switch.on::after { transform: translateX(16px); }
.check-big { width: 84px; height: 84px; border-radius: 50%; background: var(--green-soft); display: grid; place-items: center; color: var(--green); animation: pop .4s var(--ease) both; }
.check-big path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw30 .5s ease .3s forwards; }
.spin { width: 44px; height: 44px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--blue); animation: spin .8s linear infinite; }
.conf { position: absolute; left: 50%; top: 84px; width: 8px; height: 12px; border-radius: 2px; animation: conf 1.2s cubic-bezier(.2, .7, .3, 1) both; pointer-events: none; }

/* ---- 8. Motion (kept short, played once) ---------------------------------- */
.enter { animation: pageIn .26s var(--ease) both; }
.rise { animation: rise .3s var(--ease) both; }
@keyframes pageIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes growX { from { transform: scaleX(0); } to { transform: scaleX(1); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes draw30 { to { stroke-dashoffset: 0; } }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes popIn { from { opacity: 0; transform: scale(.96) translateY(-4px); } to { opacity: 1; transform: none; } }
@keyframes palIn { from { opacity: 0; transform: translateX(-50%) translateY(-8px); } to { opacity: 1; transform: translateX(-50%); } }
@keyframes slideIn { from { transform: translateX(32px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: none; } }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 12px); } to { opacity: 1; transform: translate(-50%, 0); } }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes skel { from { background-position: 200% 0; } to { background-position: -20% 0; } }
@keyframes evIn { from { opacity: 0; transform: translateY(-8px); background: var(--blue-soft); } to { opacity: 1; transform: none; } }
@keyframes conf { 0% { transform: translate(0, 0) rotate(0); opacity: 1; } 100% { transform: translate(var(--cx), var(--cy)) rotate(var(--cr)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .app *, .app *::before, .app *::after { animation: none !important; transition: none !important; }
  .line, .spark path { stroke-dashoffset: 0; } .area { opacity: 1; }
}

/* ---- 9. Responsive -------------------------------------------------------- */

}

@media (max-width: 767px) {

/* ==========================================================================
   Admin dashboard prototype: overrides and additions on top of base.css
   The sidebar keeps the live admin's navy (slate-900 #0f172a) and blue-600 active state.
   ========================================================================== */
.app { --c1: #2563eb; --c2: #0e8f9b; --c3: #6d4fd6; --c4: #c2650f; --c5: #d6336c; --c6: #2f9e6b; --c7: #64748b; --c8: #0284c7; --tile: #1e40af; }
.app.dark { --c1: #5b8dff; --c2: #35c2cf; --c3: #a28cff; --c4: #e1923f; --c5: #f06595; --c6: #5fd196; --c7: #94a3b8; --c8: #38bdf8; --tile: #3b63d6; }
.page { width: min(100% - 48px, 1400px); }
@keyframes growY { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes dlgIn { from { opacity: 0; transform: translate(-50%, -48%) scale(.97); } to { opacity: 1; transform: translate(-50%, -50%); } }

/* ---- sidebar ---- */
.side.admin { --sw: 256px; background: #0f172a; border-right: 1px solid #1e293b; color: #e2e8f0; padding: 14px 12px 12px; }

.app.dark .side.admin { background: #0b1220; border-right-color: #1a2438; }
.side.admin .logo { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; }
.side.admin .name { color: #fff; font-weight: 800; letter-spacing: .01em; }
.side.admin .iconbtn.flat { color: #94a3b8; } .side.admin .iconbtn.flat:hover { background: rgba(255, 255, 255, .08); color: #fff; }
.navsearch { display: flex; align-items: center; gap: 8px; height: 38px; margin: 0 2px 10px; padding: 0 12px; border-radius: 10px; background: rgba(255, 255, 255, .07); color: #94a3b8; border: 1px solid transparent; flex: none; }
.navsearch:focus-within { border-color: #3b82f6; }
.navsearch input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: #fff; font-size: 13.5px; }
.navsearch input::placeholder { color: #8b9ab1; }
.side.admin .side-scroll { scrollbar-color: #334155 transparent; gap: 2px; }

.side.admin .nav.has-active { background: rgba(37, 99, 235, .2); color: #c7d8ff; }
.side.admin .nav.grp { font-weight: 600; }
.side.admin .nav.grp .chev { margin-left: auto; opacity: .7; }
.side.admin .nav .nav-badge + .chev { margin-left: 8px; }
.side.admin .grp-l { flex: 1; text-align: left; }
.subs { margin: 2px 0 8px 20px; border-left: 1px solid #25324a; padding-left: 10px; display: flex; flex-direction: column; gap: 1px; animation: rise .22s var(--ease) both; }
.side.admin .nav.sub { min-height: 36px; font-size: 13.3px; padding: 0 10px; gap: 10px; border-radius: 8px; }
.side.admin .nav-badge { background: #f59e0b; color: #1a1200; }
.nav-badge.sm { min-width: 18px; height: 18px; font-size: 10.5px; padding: 0 5px; }
.side.admin .side-foot { border-top: 1px solid #1e293b; margin-top: 8px; padding-top: 8px; }
.side.admin .signout { color: #fca5a5; border-top: 0; margin-top: 0; }
.side.admin .signout:hover { background: rgba(248, 113, 113, .12); color: #fecaca; }
.usercard { display: flex; align-items: center; gap: 10px; padding: 10px 6px 0; }
.usercard .avatar { background: #1e293b; color: #cbd5e1; width: 36px; height: 36px; }
.usercard .lbl b { display: block; color: #fff; font-size: 13.5px; line-height: 1.2; } .usercard .lbl small { color: #8b9ab1; font-size: 12px; }
.side.admin.narrow .navsearch, .side.admin.narrow .subs, .side.admin.narrow .usercard .lbl, .side.admin.narrow .nav-label { display: none; }
.side.admin.narrow .nav.grp .chev, .side.admin.narrow .nav.grp .grp-l { display: none; }
.side.admin.narrow .usercard { justify-content: center; padding-left: 0; padding-right: 0; }
.side.admin.narrow .nav-badge { display: grid; position: absolute; top: 4px; right: 8px; min-width: 16px; height: 16px; font-size: 10px; }
.side.admin.narrow .nav { position: relative; }
.side.admin.narrow .side-head .name { display: none; }

/* ---- cards and headings ---- */
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.sysbtn { position: relative; } .sysdot { position: absolute; top: 3px; right: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); border: 2px solid var(--surface); }
.sw-row { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding: 12px 16px; border-top: 1px solid var(--line); }
.sw-row b { display: block; font-size: 14px; } .sw-row small { display: block; color: var(--muted); font-size: 12.5px; }
button.switch { width: 46px; height: 26px; border: 0; padding: 0; }
button.switch::after { width: 20px; height: 20px; top: 3px; left: 3px; } button.switch.on::after { transform: translateX(20px); }
.switch.amber.on { background: var(--amber); }
.iconbtn.spinning svg { animation: spin .8s linear infinite; }
.dialog { position: fixed; z-index: 101; top: 50%; left: 50%; transform: translate(-50%, -50%); width: min(440px, 92vw); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px; box-shadow: 0 30px 70px rgba(0, 0, 0, .35); animation: dlgIn .2s var(--ease) both; }
.preq { display: flex; gap: 14px; padding: 16px 0; border-top: 1px solid var(--line); }
.preq:first-child { border-top: 0; }

/* ---- KPI cards ---- */
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; }
.kpi { position: relative; overflow: hidden; border-radius: 18px; padding: 18px; color: #fff; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 180px; background: linear-gradient(135deg, var(--k1), var(--k2)); box-shadow: 0 12px 24px -14px var(--k2); transition: transform .2s var(--ease), box-shadow .2s; width: 100%; }
.kpi:hover { transform: translateY(-3px); box-shadow: 0 16px 28px -14px var(--k2); }
.kpi::after { content: ""; position: absolute; right: -38px; top: -38px; width: 124px; height: 124px; border-radius: 50%; border: 18px solid rgba(255, 255, 255, .08); pointer-events: none; }
.app.dark .kpi { filter: saturate(.85) brightness(.9); }
.k-blue { --k1: #2563eb; --k2: #1e40af; } .k-indigo { --k1: #4f46e5; --k2: #3730a3; } .k-green { --k1: #047857; --k2: #065f46; } .k-amber { --k1: #b45309; --k2: #92400e; } .k-rose { --k1: #be123c; --k2: #9f1239; }
.k-top { display: flex; align-items: center; gap: 10px; position: relative; z-index: 1; }
.k-ic { width: 34px; height: 34px; border-radius: 10px; background: rgba(255, 255, 255, .2); display: grid; place-items: center; flex: none; }
.k-label { font-size: 11.5px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; line-height: 1.25; }
.k-big { font-size: 34px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; margin-top: 6px; display: block; }
.k-sub { font-size: 12.5px; line-height: 1.4; }
.k-splitbar { display: block; height: 6px; border-radius: 99px; background: rgba(255, 255, 255, .28); overflow: hidden; margin-top: 2px; } .k-splitbar i { display: block; height: 100%; background: #fff; border-radius: 99px; }
.k-foot { margin-top: auto; min-height: 26px; padding-top: 6px; position: relative; z-index: 1; }
.delta { display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px; border-radius: 99px; background: rgba(0, 0, 0, .26); font-size: 12px; font-weight: 650; }
.k-spark { position: absolute; right: 16px; top: 66px; width: 78px; height: 30px; opacity: .65; } .k-spark path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s var(--ease) .3s forwards; }

/* ---- traffic, domains, types, revenue ---- */
.card.grow { display: flex; flex-direction: column; } .card.grow .plot { flex: 1 1 auto; height: auto; min-height: 250px; }
.row.pg { padding: 10px 20px; gap: 12px; }
.pg .no { width: 24px; height: 24px; border-radius: 8px; background: var(--surface-2); color: var(--muted); display: grid; place-items: center; font-size: 12px; font-weight: 650; flex: none; }
.pgb { flex: 1; min-width: 0; display: block; } .pgb b { display: block; font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { display: block; height: 5px; border-radius: 99px; background: var(--surface-2); margin-top: 6px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; transition: width .5s var(--ease); }
.cnt { background: var(--blue-soft); color: var(--blue-ink); border-radius: 8px; padding: 2px 10px; font-weight: 650; font-size: 12.5px; }
.domlist { display: flex; flex-direction: column; gap: 2px; }
.dom { display: grid; grid-template-columns: minmax(150px, 1.6fr) minmax(0, 2fr) 72px 48px; gap: 12px; align-items: center; padding: 7px 8px; margin: 0 -8px; border-radius: 10px; font-size: 13.5px; transition: background .2s; }
.dom.hot { background: var(--surface-2); }
.dn { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dbar { height: 10px; border-radius: 99px; background: var(--surface-2); overflow: hidden; } .dbar i { display: block; height: 100%; background: var(--blue); border-radius: 99px; }
.dv { text-align: right; font-weight: 600; } .dp { text-align: right; color: var(--muted); font-size: 12.5px; }
.donutwrap { display: flex; flex-wrap: wrap; align-items: center; gap: 22px; }
.typelist { flex: 1 1 230px; min-width: 0; display: flex; flex-direction: column; gap: 1px; } .typelist .tn { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .typelist .tv { white-space: nowrap; font-size: 12.5px; }
.revplot { display: flex; align-items: stretch; gap: 6px; height: 250px; border-bottom: 1px solid var(--line); }
.rbar { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 0; gap: 4px; }
.rbar .rv { height: 16px; font-size: 11px; font-weight: 700; opacity: 0; transition: opacity .15s; white-space: nowrap; } .rbar.hot .rv { opacity: 1; }
.rbar .bw { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; min-height: 0; }
.rbar i { display: block; width: 100%; max-width: 34px; border-radius: 8px 8px 3px 3px; background: var(--blue); transform-origin: bottom; animation: growY .7s var(--ease) both; min-height: 3px; transition: filter .2s; }
.rbar.zero i { background: var(--line-2); } .rbar.hot i { filter: brightness(1.18); }
.rbar .rl { height: 22px; font-size: 11px; color: var(--muted); padding-top: 4px; }
.revlabels { display: none; }
.tag.bad { background: var(--red-soft); color: var(--red); }

/* ---- India tile map ---- */
.mstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
.mstat { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); text-align: left; transition: border-color .2s, background .2s, transform .2s; font-size: 13px; color: var(--muted); font-weight: 500; }
.mstat b { font-size: 26px; line-height: 1.15; color: var(--ink); letter-spacing: -.02em; }
.mstat .mi { width: 28px; height: 28px; border-radius: 8px; background: var(--blue-soft); color: var(--blue-ink); display: grid; place-items: center; margin-bottom: 4px; }
.mstat:hover { border-color: var(--line-2); } .mstat.on { border-color: var(--blue); background: var(--blue-soft); }
.india { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.tilemap { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 6px; }
.tile { aspect-ratio: 1; border-radius: 10px; font-size: 12px; font-weight: 700; display: grid; place-items: center; border: 2px solid transparent; transition: transform .15s, border-color .15s; animation: pop .35s var(--ease) both; }
.tile:hover { transform: scale(1.08); } .tile.sel { border-color: var(--ink); transform: scale(1.06); }
.mlegend { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--muted); }
.lg { display: inline-flex; gap: 3px; } .lg i { width: 28px; height: 10px; border-radius: 3px; }
.lg i:nth-child(1) { background: color-mix(in srgb, var(--tile) 14%, var(--surface-2)); } .lg i:nth-child(2) { background: color-mix(in srgb, var(--tile) 30%, var(--surface-2)); } .lg i:nth-child(3) { background: color-mix(in srgb, var(--tile) 48%, var(--surface-2)); } .lg i:nth-child(4) { background: color-mix(in srgb, var(--tile) 75%, var(--surface-2)); } .lg i:nth-child(5) { background: color-mix(in srgb, var(--tile) 92%, var(--surface-2)); }
.seldetail { border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; background: var(--surface-2); }
.seldetail h3 { font-size: 21px; margin: 2px 0 10px; letter-spacing: -.015em; } .selnums { display: flex; gap: 22px; flex-wrap: wrap; } .selnums span { display: flex; flex-direction: column; font-size: 12.5px; color: var(--muted); } .selnums b { font-size: 26px; color: var(--ink); line-height: 1.15; }
.revcard { background: linear-gradient(135deg, #047857, #065f46); color: #fff; border-radius: 14px; padding: 14px 18px; } .revcard .eyebrow { color: #fff; opacity: .92; } .revcard b { font-size: 30px; display: block; letter-spacing: -.02em; }
.board { display: flex; flex-direction: column; gap: 2px; }
.board button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 8px; border-radius: 10px; min-height: 52px; } .board button:hover { background: var(--surface-2); }
.board .no { width: 22px; color: var(--muted); font-size: 12.5px; text-align: right; }
.bn { flex: 1; min-width: 0; display: block; } .bn b { display: block; font-size: 13.5px; } .bn small { display: block; color: var(--muted); font-size: 12px; } .bv { font-size: 16px; }

/* ---- recent activity table ---- */
.trow { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.6fr) 120px 120px 80px; gap: 12px; align-items: center; padding: 13px 20px; border-top: 1px solid var(--line); font-size: 13.5px; }
.trow.u { grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr) minmax(0, 1.2fr) 100px; }
.trow:not(.thead):hover { background: var(--surface-2); }
.thead { background: var(--surface-2); font-size: 11px; font-weight: 650; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding-top: 9px; padding-bottom: 9px; border-top: 1px solid var(--line); }
.trow .c1 b { font-weight: 600; } .trow .c3 { font-weight: 600; }

/* ---- responsive ---- */
@media (max-width: 1279px) {
  .kpis { grid-template-columns: repeat(6, minmax(0, 1fr)); } .kpi:nth-child(-n+3) { grid-column: span 2; } .kpi:nth-child(n+4) { grid-column: span 3; }
  .india { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 1099px) { .page { width: min(100% - 40px, 1400px); } .mstats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 767px) {
  .page { width: min(100% - 28px, 1400px); }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .kpi, .kpi:nth-child(n) { grid-column: auto; min-height: 168px; padding: 16px; } .kpi:last-child { grid-column: 1 / -1; }
  .k-big { font-size: 28px; } .k-spark { width: 64px; }
  .dom { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "n v" "b b"; row-gap: 6px; } .dom .dn { grid-area: n; } .dom .dv { grid-area: v; } .dom .dp { display: none; } .dom .dbar { grid-area: b; }
  .thead { display: none; }
  .trow { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "a st" "b c" "d d"; gap: 4px 12px; padding: 14px 16px; } .trow .c1 { grid-area: a; } .trow .c4 { grid-area: st; justify-self: end; } .trow .c2 { grid-area: b; color: var(--muted); } .trow .c3 { grid-area: c; justify-self: end; } .trow .c5 { grid-area: d; }
  .trow.u { grid-template-areas: "a d" "b c"; } .trow.u .c2 { grid-area: b; } .trow.u .c3 { grid-area: c; justify-self: end; } .trow.u .c5 { grid-area: d; justify-self: end; }
  .tilemap { gap: 4px; } .tile { font-size: 10.5px; border-radius: 8px; border-width: 1.5px; }
  .tl { display: none; } .seg button .tl { display: none; } .seg button[aria-pressed="true"] .tl { display: inline; }
  .donutwrap { justify-content: center; } .revplot { height: 210px; } .rbar .rl { font-size: 10px; }
  .mstat b { font-size: 22px; }
}
@media (max-width: 480px) { .kpi, .kpi:nth-child(n) { min-height: 150px; padding: 14px; } .k-big { font-size: 26px; } .k-spark { display: none; } .k-label { font-size: 10.5px; } .k-ic { width: 30px; height: 30px; } .delta { font-size: 11.5px; padding: 3px 8px; } }

</style>

<body>
<div id="root"></div>

<!-- Markup: {{holes}}, <sc-if>, <sc-for>, <sc-icon>. Edit freely; reload to see it. -->
<script type="text/x-dc-template" id="dc-template">
<div class="app {{themeCls}}" style="--mw:{{mw}}px">
<a class="skip" href="#main">Skip to content</a>
<aside class="{{sideCls}}" aria-label="Sidebar" aria-hidden="{{sideHidden}}" onKeyDown="{{sideKey}}">
  <div class="side-head">
    <span class="logo" aria-hidden="true">ST</span>
    <span class="name">STM ADMIN</span>
    <button class="iconbtn flat" onClick="{{toggleSide}}" aria-label="{{sideToggleLabel}}"><sc-icon name="{{sideToggleIcon}}" size="18"></sc-icon></button>
  </div>
  <sc-if value="{{showNavSearch}}" hint-placeholder-val="{{ true }}"><label class="navsearch"><sc-icon name="search" size="16"></sc-icon><span class="sr">Find a page</span><input type="search" value="{{navq}}" onInput="{{setNavq}}" placeholder="Find a page…"></label></sc-if>
  <nav class="side-scroll" aria-label="Admin navigation">
    <button class="{{dashItem.cls}}" onClick="{{dashItem.go}}" aria-current="{{dashItem.cur}}" aria-label="Dashboard" onMouseEnter="{{dashItem.enter}}" onMouseLeave="{{dashItem.leave}}" onFocus="{{dashItem.enter}}" onBlur="{{dashItem.leave}}"><sc-icon name="grid" size="19"></sc-icon><span class="lbl">Dashboard</span></button>
