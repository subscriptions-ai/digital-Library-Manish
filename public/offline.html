<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · STM Digital Library</title>
  <meta name="theme-color" content="#0F172B" />
  <style>
    body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fff;color:#0F172B;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px;box-sizing:border-box}
    main{max-width:420px;text-align:center}
    img{width:96px;height:96px}
    h1{font-size:22px;margin:20px 0 8px}
    p{color:#475569;line-height:1.55;margin:0 0 24px}
    button{background:#1B5DFC;color:#fff;border:0;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:600;cursor:pointer}
    button:focus-visible{outline:3px solid #0F172B;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="STM Digital Library" />
    <h1>You’re offline</h1>
    <p>You’re offline. Reconnect to continue using STM Digital Library.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
